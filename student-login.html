<!-- =========================
     STUDENT LOGIN
========================= -->

<section class="login-container">

<div class="login-box">

<h1>Student Login</h1>

<p>
Login to view your Profile, Attendance, Fees and Study Material
</p>


<form id="loginForm" class="login-form">


<div class="input-group">

<label>Student ID</label>

<input
type="text"
id="studentId"
placeholder="Enter Student ID"
required>

</div>


<div class="input-group">

<label>Password</label>

<input
id="password"
type="password"
placeholder="Enter Password"
required>

</div>


<a
href="forgot-password.html"
class="forgot-password">

🔐 Forgot Password?

</a>


<button
type="submit"
id="loginBtn"
class="login-btn">

LOGIN

</button>


</form>


<p class="register-text">

Don't have an account?

<a href="student-register.html">
Register Now
</a>

</p>


</div>

</section>


<script type="module" src="js/student-login.js"></script>

</body>

</html>
