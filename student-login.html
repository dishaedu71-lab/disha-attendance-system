<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | Disha Computer Education</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

/* ===============================
   STUDENT LOGIN - CYBER THEME
================================ */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:
        linear-gradient(rgba(3,8,18,.78),rgba(3,8,18,.88)),
        url("images/background.jpg") center/cover fixed;
    color:#fff;
}

/* NAVBAR */

nav{
    height:70px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(3,8,18,.75);
    border-bottom:1px solid rgba(0,255,255,.25);
    backdrop-filter:blur(12px);
}

nav .logo{
    color:#00f7ff;
    font-size:22px;
    font-weight:800;
    letter-spacing:1px;
    text-shadow:
        0 0 5px #00f7ff,
        0 0 15px #00f7ff;
}

/* LOGIN CONTAINER */

.login-container{
    width:min(430px,92%);
    margin:70px auto;
    padding:40px 35px;
    background:rgba(10,18,32,.82);
    border:1px solid rgba(0,255,255,.35);
    border-radius:22px;

    box-shadow:
        0 0 20px rgba(0,255,255,.15),
        0 0 60px rgba(0,100,255,.12);

    backdrop-filter:blur(18px);
    text-align:center;
}

/* TITLE */

.login-container h1{
    margin:0 0 10px;
    font-size:38px;
    color:#fff;

    text-shadow:
        0 0 8px #00f7ff,
        0 0 20px rgba(0,247,255,.7);
}

.login-container p{
    color:#a9c4d0;
    margin-bottom:30px;
}

/* INPUT GROUP */

.login-container input{
    width:100%;
    height:50px;
    margin:9px 0;
    padding:0 16px;

    background:rgba(0,0,0,.55);
    color:#fff;

    border:1px solid #24515d;
    border-radius:10px;
    outline:none;

    font-size:15px;
    transition:.3s;
}

.login-container input::placeholder{
    color:#7f9aa5;
}

.login-container input:focus{
    border-color:#00f7ff;

    box-shadow:
        0 0 8px rgba(0,247,255,.5),
        0 0 20px rgba(0,247,255,.2);

    background:rgba(0,15,25,.85);
}

/* LOGIN BUTTON */

.login-container button,
button[type="submit"]{
    width:100%;
    height:52px;
    margin-top:18px;

    border:none;
    border-radius:10px;

    background:linear-gradient(
        90deg,
        #0066ff,
        #00eaff
    );

    color:#001018;
    font-size:16px;
    font-weight:800;
    letter-spacing:1px;

    cursor:pointer;

    box-shadow:
        0 0 10px rgba(0,234,255,.4);

    transition:.25s;
}

/* HACKER HOVER */

.login-container button:hover,
button[type="submit"]:hover{

    transform:translateY(-2px);

    background:#00ff9d;

    color:#00150d;

    box-shadow:
        0 0 8px #00ff9d,
        0 0 20px #00ff9d,
        0 0 45px rgba(0,255,157,.7);

    letter-spacing:2px;
}

/* CLICK */

.login-container button:active,
button[type="submit"]:active{
    transform:scale(.97);
}

/* FORGOT LINK */

.forgot-password{
    display:inline-block;
    margin-top:18px;

    color:#00f7ff;
    font-weight:bold;
    text-decoration:none;

    transition:.25s;
}

.forgot-password:hover{
    color:#00ff9d;
    text-shadow:
        0 0 5px #00ff9d,
        0 0 15px #00ff9d;
}

/* REGISTER */

.login-container a{
    color:#00f7ff;
}

.login-container a:hover{
    color:#00ff9d;
}


/* MOBILE */

@media(max-width:600px){

    nav{
        padding:0 18px;
    }

    nav .logo{
        font-size:16px;
    }

    .login-container{
        margin:35px auto;
        padding:30px 22px;
    }

    .login-container h1{
        font-size:30px;
    }
}

</style>

</head>

<body>

<nav>

<div class="logo">
<i class="fa-solid fa-graduation-cap"></i>
DISHA COMPUTER EDUCATION
</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="study.html">Study Portal</a></li>
</ul>

<a href="login.html" class="login-btn">
Teacher Login
</a>

</nav>

<section class="hero">

<div class="glass">

<h1>Student Login</h1>

<p>Login to view your Profile, Attendance, Fees and Study Material</p>

<form id="loginForm">

<input
type="text"
id="studentId"
placeholder="Student ID"
required>

<br><br>

<input
id="password"
type="password"
placeholder="Password">

<div style="text-align:center;margin-top:12px;">

    <a href="forgot-password.html"
       style="
       color:#00eaff;
       text-decoration:none;
       font-weight:bold;">

       🔐 Forgot Password?

    </a>

</div>

<button id="loginBtn">
LOGIN
</button>

</form>

<br>

<p>

Don't have an account?

<a href="student-register.html">

Register Now

</a>

</p>

</div>

</section>

  <script type="module" src="js/student-login.js"></script>

</body>

</html>
