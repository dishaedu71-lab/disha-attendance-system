<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Apply Online | Disha Computer Education</title>

<link rel="stylesheet"
href="css/course-apply.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<!-- BACKGROUND PARTICLES -->

<div class="particles">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>



<!-- TOP NAV -->

<nav class="apply-nav">

    <div class="brand">

        <i class="fa-solid fa-laptop-code"></i>

        <span>
            DISHA COMPUTER EDUCATION
        </span>

    </div>


    <a href="courses.html"
       class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        Back to Courses

    </a>

</nav>



<!-- MAIN -->

<main class="apply-container">


    <!-- HEADER -->

    <section class="apply-header">

        <div class="apply-badge">

            <i class="fa-solid fa-graduation-cap"></i>

            ONLINE ADMISSION

        </div>


        <h1>

            Start Your
            <span>Digital Journey</span>

        </h1>


        <p>

            Fill in your details below and submit your
            application to Disha Computer Education.

        </p>

    </section>



    <!-- APPLICATION CARD -->

    <section class="application-card">


        <!-- CARD TOP -->

        <div class="card-top">

            <div class="card-icon">

                <i class="fa-solid fa-file-signature"></i>

            </div>


            <div>

                <h2>
                    Online Application Form
                </h2>

                <p>
                    Complete the form carefully
                </p>

            </div>

        </div>



        <!-- FORM -->

        <form id="courseApplicationForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="appName">

                    <i class="fa-solid fa-user"></i>

                    Full Name

                </label>


                <input
                    type="text"
                    id="appName"
                    placeholder="Enter your full name"
                    required>

            </div>



            <!-- MOBILE + EMAIL -->

            <div class="form-row">


                <div class="form-group">

                    <label for="appMobile">

                        <i class="fa-solid fa-phone"></i>

                        Mobile Number

                    </label>


                    <input
                        type="tel"
                        id="appMobile"
                        placeholder="Enter 10 digit mobile number"
                        maxlength="10"
                        required>

                </div>



                <div class="form-group">

                    <label for="appEmail">

                        <i class="fa-solid fa-envelope"></i>

                        Email Address

                    </label>


                    <input
                        type="email"
                        id="appEmail"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>



            <!-- QUALIFICATION -->

            <div class="form-group">

                <label for="appQualification">

                    <i class="fa-solid fa-user-graduate"></i>

                    Qualification

                </label>


                <select
                    id="appQualification"
                    required>

                    <option value="">
                        Select your qualification
                    </option>

                    <option value="10th">
                        10th
                    </option>

                    <option value="12th">
                        12th
                    </option>

                    <option value="Graduate">
                        Graduate
                    </option>

                    <option value="Post Graduate">
                        Post Graduate
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>



            <!-- COURSE -->

            <div class="form-group">

                <label for="appCourse">

                    <i class="fa-solid fa-laptop-code"></i>

                    Select Course

                </label>


                <select
                    id="appCourse"
                    required>

                    <option value="">
                        Select Course
                    </option>

                    <option value="ADCA">
                        ADCA
                    </option>

                    <option value="DCA">
                        DCA
                    </option>

                    <option value="O Level">
                        O Level
                    </option>

                    <option value="CCC">
                        CCC
                    </option>

                    <option value="Python">
                        Python Programming
                    </option>

                    <option value="Web Designing">
                        Web Designing
                    </option>

                    <option value="Web Development">
                        Web Development
                    </option>

                    <option value="Java">
                        Java Programming
                    </option>

                    <option value="C Programming">
                        C Programming
                    </option>

                    <option value="C++">
                        C++ Programming
                    </option>

                    <option value="Tally">
                        Tally
                    </option>

                    <option value="Excel">
                        Advanced Excel
                    </option>

                    <option value="Data Entry">
                        Data Entry
                    </option>

                    <option value="AI">
                        Artificial Intelligence
                    </option>

                    <option value="IoT">
                        Internet of Things
                    </option>

                    <option value="Other">
                        Other Course
                    </option>

                </select>

            </div>



            <!-- ADDRESS -->

            <div class="form-group">

                <label for="appAddress">

                    <i class="fa-solid fa-location-dot"></i>

                    Address

                </label>


                <input
                    type="text"
                    id="appAddress"
                    placeholder="Enter your complete address"
                    required>

            </div>



            <!-- MESSAGE -->

            <div class="form-group">

                <label for="appMessage">

                    <i class="fa-solid fa-message"></i>

                    Message

                </label>


                <textarea
                    id="appMessage"
                    rows="4"
                    placeholder="Tell us anything you would like to know..."></textarea>

            </div>



            <!-- APPLICATION ID AREA -->

            <div
                id="applicationStatus"
                class="application-status">

            </div>



            <!-- SUBMIT -->

            <button
                type="submit"
                class="apply-submit-btn">

                <span class="btn-content">

                    <i class="fa-solid fa-paper-plane"></i>

                    SUBMIT APPLICATION

                </span>


                <span class="btn-loader">

                    <i class="fa-solid fa-spinner"></i>

                </span>

            </button>


        </form>


    </section>



    <!-- TRUST AREA -->

    <section class="apply-trust">

        <div>

            <i class="fa-solid fa-shield-halved"></i>

            <span>
                Secure Application
            </span>

        </div>


        <div>

            <i class="fa-solid fa-database"></i>

            <span>
                Digital Record
            </span>

        </div>


        <div>

            <i class="fa-solid fa-headset"></i>

            <span>
                Expert Support
            </span>

        </div>

    </section>


</main>



<!-- JAVASCRIPT -->

<script src="js/course-apply.js"></script>


</body>

</html>
