<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h2>🔐 Forgot Password</h2>

        <p>
            Enter your Student ID to receive a
            password reset link on your registered email.
        </p>

        <label>Student ID</label>

        <input
            type="text"
            id="studentId"
            placeholder="Enter Student ID"
            autocomplete="off">

        <button
            id="sendResetBtn"
            class="login-btn">

            📧 SEND RESET LINK

        </button>

        <p id="message"
           style="
           margin-top:15px;
           text-align:center;">
        </p>

        <div style="
        text-align:center;
        margin-top:15px;">

            <a href="student-login.html">

                ← Back to Login

            </a>

        </div>

    </div>

</div>


<!-- Firebase -->

<script type="module"
src="js/firebase.js">
</script>

<script
src="js/forgot-password.js">
</script>

</body>

</html>
