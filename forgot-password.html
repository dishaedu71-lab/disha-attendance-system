<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet" href="css/style.css">

    <style>

/* ===============================
   FORGOT PASSWORD - CYBER UI
================================ */

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, Helvetica, sans-serif;

    background:
        linear-gradient(
            rgba(2,7,15,.78),
            rgba(2,7,15,.90)
        ),
        url("images/background.jpg") center/cover fixed;

    color:#fff;
}

/* MAIN BOX */

.forgot-container{
    width:min(460px,92%);
    padding:42px 35px;

    text-align:center;

    background:rgba(8,17,30,.88);

    border:1px solid rgba(0,255,255,.4);
    border-radius:22px;

    backdrop-filter:blur(18px);

    box-shadow:
        0 0 20px rgba(0,255,255,.15),
        0 0 60px rgba(0,120,255,.15);
}

/* TITLE */

.forgot-container h1{
    margin:0 0 10px;

    font-size:34px;

    color:#fff;

    text-shadow:
        0 0 8px #00f7ff,
        0 0 20px #00f7ff;
}

.forgot-container p{
    color:#9fb7c2;
    font-size:14px;
    margin-bottom:28px;
}

/* LABEL */

.forgot-container label{
    display:block;
    text-align:left;

    margin-bottom:8px;

    color:#00f7ff;
    font-weight:bold;
}

/* INPUT */

.forgot-container input{
    width:100%;
    height:50px;

    padding:0 15px;

    background:rgba(0,0,0,.6);

    color:#fff;

    border:1px solid #31505b;
    border-radius:10px;

    outline:none;

    font-size:15px;

    transition:.3s;
}

.forgot-container input:focus{
    border-color:#00f7ff;

    box-shadow:
        0 0 8px #00f7ff,
        0 0 20px rgba(0,247,255,.25);
}

/* RESET BUTTON */

.forgot-container button{
    width:100%;
    height:52px;

    margin-top:20px;

    border:0;
    border-radius:10px;

    background:linear-gradient(
        90deg,
        #0066ff,
        #00eaff
    );

    color:#001018;

    font-size:15px;
    font-weight:800;

    cursor:pointer;

    transition:.25s;
}

/* HACKER HOVER */

.forgot-container button:hover{
    background:#00ff9d;

    color:#00150d;

    transform:translateY(-2px);

    box-shadow:
        0 0 8px #00ff9d,
        0 0 20px #00ff9d,
        0 0 45px rgba(0,255,157,.7);

    letter-spacing:1px;
}

/* BACK LOGIN */

.forgot-container .back-login{
    display:inline-block;

    margin-top:22px;

    color:#00f7ff;

    text-decoration:none;
    font-weight:bold;

    transition:.25s;
}

.forgot-container .back-login:hover{
    color:#00ff9d;

    text-shadow:
        0 0 5px #00ff9d,
        0 0 15px #00ff9d;
}

/* MOBILE */

@media(max-width:600px){

    .forgot-container{
        padding:32px 22px;
    }

    .forgot-container h1{
        font-size:28px;
    }
}

</style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h2>🔐 Forgot Password</h2>

        <p>
            Enter your Student ID to receive a
            password reset link on your registered email.
        </p>

        <label>Student ID</label>

        <input
            type="text"
            id="studentId"
            placeholder="Enter Student ID"
            autocomplete="off">

        <button
            id="sendResetBtn"
            class="login-btn">

            📧 SEND RESET LINK

        </button>

        <p id="message"
           style="
           margin-top:15px;
           text-align:center;">
        </p>

        <div style="
        text-align:center;
        margin-top:15px;">

            <a href="student-login.html">

                ← Back to Login

            </a>

        </div>

    </div>

</div>


<!-- Firebase -->

<script type="module"
src="js/firebase.js">
</script>

<script
src="js/forgot-password.js">
</script>

</body>

</html>
