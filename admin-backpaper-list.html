<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Back Paper Requests

</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<nav>

<div class="logo">

<i class="fa-solid fa-graduation-cap"></i>

DISHA COMPUTER EDUCATION

</div>

<ul>

<li>

<a href="admin-dashboard.html">

Dashboard

</a>

</li>

</ul>

</nav>

<section class="hero">

<div class="glass">

<h1>

<i class="fa-solid fa-file-signature"></i>

Back Paper Requests

</h1>

<p>

Manage Student Back Paper Applications

</p>

</div>

</section>
<section class="dashboard">

<div
style="
width:98%;
max-width:1700px;
margin:auto;">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:15px;">

<h2
style="
color:white;
font-size:32px;">

📋 Back Paper Applications

</h2>

<input
type="text"
id="searchBox"
placeholder="Search Student..."
style="
padding:12px 18px;
width:320px;
font-size:17px;
border-radius:10px;
border:none;">

</div>

<div
class="card"
style="
padding:20px;
overflow-x:auto;
border-radius:18px;">

<table
id="backTableMain"
style="
width:100%;
min-width:1450px;
border-collapse:collapse;
text-align:center;">

<thead>

<tr
style="
background:#007bff;
color:white;">

<th style="padding:15px;">Name</th>

<th>Student ID</th>

<th>Course</th>

<th>Mobile</th>

<th>Subject</th>

<th>Reason</th>

<th>Date</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="backTable">

</tbody>

</table>

</div>

</div>

</section>
<script type="module" src="js/firebase.js"></script>

<script src="js/admin-backpaper-list.js"></script>

</body>

</html>
