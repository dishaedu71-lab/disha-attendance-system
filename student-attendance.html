
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Attendance | Disha Computer Education</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    min-height:100vh;
    background:
    radial-gradient(circle at top left,#09203f,#020617 45%,#000);
    color:white;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
}

.header{
    text-align:center;
    margin:20px 0 25px;
}

.logo{
    width:80px;
    height:80px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,#00eaff,#0066ff);

    box-shadow:
    0 0 15px #00eaff,
    0 0 40px #0066ff;

    font-size:35px;
}

.header h1{
    margin-top:15px;
    font-size:26px;
}

.header p{
    color:#9ca3af;
    margin-top:5px;
}

.card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(0,234,255,.25);
    border-radius:22px;
    padding:22px;
    margin-bottom:18px;

    backdrop-filter:blur(15px);

    box-shadow:
    0 10px 35px rgba(0,0,0,.35);
}

.card-title{
    color:#00eaff;
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:13px 0;

    border-bottom:1px solid rgba(255,255,255,.08);
}

.info-row:last-child{
    border-bottom:none;
}

.info-label{
    color:#9ca3af;
}

.info-value{
    font-weight:bold;
    color:#fff;
    text-align:right;
}

.location-box{
    text-align:center;
}

#locationStatus{
    font-size:18px;
    font-weight:bold;
    color:#00eaff;
    margin-bottom:12px;
}

#locationMessage{
    color:#cbd5e1;
    line-height:1.6;
    font-size:14px;
}

.mark-attendance-btn{
    width:100%;
    margin-top:20px;

    padding:16px;

    border:none;
    border-radius:14px;

    background:linear-gradient(
        135deg,
        #00eaff,
        #0066ff
    );

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 15px rgba(0,234,255,.4);

    transition:.3s;
}

.mark-attendance-btn:hover{
    transform:translateY(-2px);

    box-shadow:
    0 0 25px rgba(0,234,255,.8);
}

.mark-attendance-btn:disabled{
    background:#374151;
    color:#9ca3af;
    cursor:not-allowed;
    box-shadow:none;
}

.success{
    color:#22c55e !important;
}

.error{
    color:#ef4444 !important;
}

.warning{
    color:#f59e0b !important;
}

.footer{
    text-align:center;
    color:#64748b;
    font-size:12px;
    margin-top:25px;
}

.loader{
    display:inline-block;
    width:16px;
    height:16px;

    border:2px solid rgba(255,255,255,.3);
    border-top-color:#00eaff;

    border-radius:50%;

    animation:spin .8s linear infinite;

    vertical-align:middle;
    margin-right:6px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

</style>
</head>


<body>

<div class="container">

    <div class="header">

        <div class="logo">
            🎓
        </div>

        <h1>
            Disha Computer Education
        </h1>

        <p>
            Student Self Attendance
        </p>

    </div>


    <!-- STUDENT INFORMATION -->

    <div class="card">

        <div class="card-title">
            👤 Student Information
        </div>

        <div class="info-row">

            <span class="info-label">
                Student ID
            </span>

            <span
                class="info-value"
                id="studentId">
                Loading...
            </span>

        </div>


        <div class="info-row">

            <span class="info-label">
                Student Name
            </span>

            <span
                class="info-value"
                id="studentName">
                Loading...
            </span>

        </div>


        <div class="info-row">

            <span class="info-label">
                Course
            </span>

            <span
                class="info-value"
                id="studentCourse">
                Loading...
            </span>

        </div>

    </div>


    <!-- LOCATION -->

    <div class="card location-box">

        <div class="card-title">
            📍 Center Location Verification
        </div>


        <div id="locationStatus">

            <span class="loader"></span>

            Checking Location...

        </div>


        <div id="locationMessage">

            आपकी location verify की जा रही है।

        </div>


        <button
            type="button"
            id="markAttendanceBtn"
            class="mark-attendance-btn"
            disabled>

            🔐 VERIFYING...

        </button>

    </div>


    <div class="footer">

        © 2026 Disha Computer Education<br>
        Student Attendance System

    </div>

</div>


<!-- ==================================================
     FIREBASE + ATTENDANCE SYSTEM
================================================== -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    doc,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyCi0gz9XPJvAUUaMaGYXEC2jTQuOmkRRGM",

    authDomain:
    "disha-attendance-system.firebaseapp.com",

    projectId:
    "disha-attendance-system",

    storageBucket:
    "disha-attendance-system.firebasestorage.app",

    messagingSenderId:
    "492796083174",

    appId:
    "1:492796083174:web:3bdfa2b30071c3fae07427",

    measurementId:
    "G-YP9RLS7XJE"

};


/* ==================================================
   FIREBASE INITIALIZE
================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ==================================================
   HTML ELEMENTS
================================================== */

const studentIdBox =
    document.getElementById("studentId");

const studentNameBox =
    document.getElementById("studentName");

const studentCourseBox =
    document.getElementById("studentCourse");

const locationStatus =
    document.getElementById("locationStatus");

const locationMessage =
    document.getElementById("locationMessage");

const attendanceButton =
    document.getElementById("markAttendanceBtn");


/* ==================================================
   CENTER LOCATION

   IMPORTANT:
   फिलहाल यहाँ वही coordinates रखे गए हैं
   जो आपके पुराने attendance page में थे।
================================================== */

const CENTER_LATITUDE = 26.7558402;

const CENTER_LONGITUDE = 82.1374394;


/* ==================================================
   ATTENDANCE RADIUS
================================================== */

const CENTER_RADIUS = 100;


/* ==================================================
   GPS ACCURACY
================================================== */

const MAX_GPS_ACCURACY = 2000;


/* ==================================================
   CURRENT STUDENT
================================================== */

let currentStudent = null;

let locationVerified = false;


/* ==================================================
   DISTANCE CALCULATOR
================================================== */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371000;

    const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

    const dLon =
        (lon2 - lon1) *
        Math.PI / 180;


    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(
            lat1 * Math.PI / 180
        )

        *

        Math.cos(
            lat2 * Math.PI / 180
        )

        *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/* ==================================================
   TODAY DATE
================================================== */

function getToday(){

    const now = new Date();

    return (

        now.getFullYear()
        + "-"
        +

        String(
            now.getMonth() + 1
        ).padStart(2,"0")

        + "-"
        +

        String(
            now.getDate()
        ).padStart(2,"0")

    );

}


/* ==================================================
   CURRENT TIME
================================================== */

function getCurrentTime(){

    return new Date().toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );

}


/* ==================================================
   STUDENT LOGIN CHECK
================================================== */

onAuthStateChanged(
    auth,
    async (user) => {

        console.log(
            "Firebase User:",
            user
        );


        if(!user){

            studentIdBox.textContent =
                "Not Logged In";

            studentNameBox.textContent =
                "—";

            studentCourseBox.textContent =
                "—";


            locationStatus.textContent =
                "🔐 Student Login Required";

            locationStatus.className =
                "error";


            locationMessage.innerHTML =
                "कृपया पहले <b>Student Login</b> करें।";


            attendanceButton.disabled = true;

            attendanceButton.textContent =
                "🔐 LOGIN REQUIRED";


            return;

        }


        /* ==========================================
           SEARCH STUDENT ACCOUNT
        ========================================== */

        try{

            const studentQuery =
                query(

                    collection(
                        db,
                        "studentAccounts"
                    ),

                    where(
                        "uid",
                        "==",
                        user.uid
                    )

                );


            const snapshot =
                await getDocs(
                    studentQuery
                );


            if(snapshot.empty){

                studentIdBox.textContent =
                    "Not Found";

                studentNameBox.textContent =
                    "—";

                studentCourseBox.textContent =
                    "—";


                locationStatus.textContent =
                    "❌ Student Not Found";

                locationStatus.className =
                    "error";


                locationMessage.innerHTML =
                    "Firebase में आपका student account नहीं मिला।";


                attendanceButton.disabled = true;

                attendanceButton.textContent =
                    "❌ VERIFICATION FAILED";


                return;

            }


            const studentDoc =
                snapshot.docs[0];


            const data =
                studentDoc.data();


            console.log(
                "Student Data:",
                data
            );


            /* ======================================
               STUDENT DATA
            ====================================== */

            currentStudent = {

                uid:
                    user.uid,

                docId:
                    studentDoc.id,

                studentId:
                    data.studentId || "",

                name:
                    data.name || "",

                course:
                    data.course || "",

                mobile:
                    data.mobile || "",

                email:
                    data.email || "",

                batch:
                    data.batch || ""

            };


            /* ======================================
               DISPLAY
            ====================================== */

            studentIdBox.textContent =
                currentStudent.studentId || "—";


            studentNameBox.textContent =
                currentStudent.name || "—";


            studentCourseBox.textContent =
                currentStudent.course || "—";


            locationStatus.textContent =
                "🟡 Student Verified";

            locationStatus.className =
                "warning";


            locationMessage.innerHTML =
                "Student verification successful.<br>" +
                "अब center की GPS location verify की जा रही है।";


            /* ======================================
               START LOCATION
            ====================================== */

            checkLocation();

        }

        catch(error){

            console.error(
                "Student Verification Error:",
                error
            );


            locationStatus.textContent =
                "❌ Verification Error";

            locationStatus.className =
                "error";


            locationMessage.innerHTML =
                "Student verification में error आया।<br>" +
                "<small>" +
                error.message +
                "</small>";


            attendanceButton.disabled = true;

        }

    }
);


/* ==================================================
   GPS LOCATION
================================================== */

function checkLocation(){

    locationStatus.textContent =
        "📡 Checking Center Location...";

    locationStatus.className =
        "warning";


    locationMessage.innerHTML =
        "आपकी GPS location verify की जा रही है...";


    attendanceButton.disabled = true;

    attendanceButton.textContent =
        "📡 VERIFYING LOCATION...";


    if(!navigator.geolocation){

        locationStatus.textContent =
            "❌ GPS Not Supported";

        locationStatus.className =
            "error";


        locationMessage.innerHTML =
            "आपके phone/browser में GPS location support नहीं है।";


        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            const distance =
                calculateDistance(

                    latitude,
                    longitude,

                    CENTER_LATITUDE,
                    CENTER_LONGITUDE

                );


            console.log(
                "Latitude:",
                latitude
            );

            console.log(
                "Longitude:",
                longitude
            );

            console.log(
                "Accuracy:",
                accuracy
            );

            console.log(
                "Distance:",
                distance
            );


            /* ======================================
               GPS ACCURACY CHECK
            ====================================== */

            if(
                accuracy >
                MAX_GPS_ACCURACY
            ){

                locationVerified = false;

                locationStatus.textContent =
                    "⚠️ GPS Accuracy Low";

                locationStatus.className =
                    "warning";


                locationMessage.innerHTML =
                    "GPS accuracy लगभग " +
                    Math.round(accuracy) +
                    " meters है।<br>" +
                    "कृपया बाहर/खुले स्थान में जाकर GPS फिर से ON करें।";


                attendanceButton.disabled = false;

                attendanceButton.textContent =
                    "🔄 TRY AGAIN";


                return;

            }


            /* ======================================
               CENTER DISTANCE CHECK
            ====================================== */

            /*
               When GPS accuracy is weak, use the reported accuracy
               as a confidence radius. When GPS is accurate, the
               normal 100m center radius remains active.
            */
            const allowedRadius =
                Math.max(CENTER_RADIUS, accuracy);

            if(distance <= allowedRadius){

                locationVerified = true;


                locationStatus.textContent =
                    "🟢 Center Location Verified";

                locationStatus.className =
                    "success";


                locationMessage.innerHTML =
                    "आप institute के अंदर / GPS confidence range में हैं।<br>" +
                    "Distance: <b>" + Math.round(distance) +
                    " meters</b><br>" +
                    "GPS Accuracy: <b>" + Math.round(accuracy) +
                    " meters</b>";


                attendanceButton.disabled = false;

                attendanceButton.textContent =
                    "📍 MARK ATTENDANCE";


            }

            else{

                locationVerified = false;


                locationStatus.textContent =
                    "🔴 Outside Institute";

                locationStatus.className =
                    "error";


                locationMessage.innerHTML =
                    "Attendance केवल institute premises से mark की जा सकती है।<br>" +
                    "आप लगभग <b>" +
                    Math.round(distance) +
                    " meters</b> दूर हैं।";


                attendanceButton.disabled = true;

                attendanceButton.textContent =
                    "🚫 LOCATION NOT ALLOWED";

            }

        },


        function(error){

            locationVerified = false;


            locationStatus.textContent =
                "❌ Location Error";

            locationStatus.className =
                "error";


            let message =
                "Location access नहीं मिल पाया।";


            if(error.code === 1){

                message =
                    "Location Permission Denied.<br>" +
                    "Phone settings में Browser की Location Permission ON करें।";

            }

            else if(error.code === 2){

                message =
                    "Location उपलब्ध नहीं है। GPS ON करके दोबारा कोशिश करें।";

            }

            else if(error.code === 3){

                message =
                    "Location प्राप्त करने में समय लग गया। दोबारा TRY AGAIN करें।";

            }


            locationMessage.innerHTML =
                message;


            attendanceButton.disabled = false;

            attendanceButton.textContent =
                "🔄 TRY AGAIN";

        },


        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }

    );

}


/* ==================================================
   MARK ATTENDANCE
================================================== */

attendanceButton.addEventListener(
    "click",
    async function(){

        if(!currentStudent){

            alert(
                "Student verification complete नहीं है।"
            );

            return;

        }


        if(!locationVerified){

            /* TRY AGAIN button now re-runs GPS verification */
            checkLocation();
            return;

        }


        attendanceButton.disabled = true;

        attendanceButton.textContent =
            "⏳ SAVING ATTENDANCE...";


        try{

            const today =
                getToday();


            /* ======================================
   FIND STUDENT IN students COLLECTION
   MATCH USING MOBILE NUMBER
====================================== */

const studentQuery =
    query(
        collection(
            db,
            "students"
        ),

        where(
            "mobile",
            "==",
            currentStudent.mobile
        )
    );

const studentSnapshot =
    await getDocs(
        studentQuery
    );

if(studentSnapshot.empty){

    throw new Error(
        "students collection में इस Mobile Number का Student नहीं मिला."
    );

}

const studentDoc =
    studentSnapshot.docs[0];

const studentRef =
    doc(
        db,
        "students",
        studentDoc.id
    );

console.log(
    "Attendance Student Found:",
    studentDoc.data()
);

            /* ======================================
               FIRESTORE TRANSACTION
            ====================================== */

            await runTransaction(
                db,
                async(transaction)=>{

                    const snap =
                        await transaction.get(
                            studentRef
                        );


                    if(!snap.exists()){

                        throw new Error(
                            "Student record not found."
                        );

                    }


                    const data =
                        snap.data();


                    const attendance =
                        data.attendance || {};


                    /* ==============================
                       DUPLICATE CHECK
                    ============================== */

                    if(
                        attendance[today] ===
                        "Present"
                    ){

                        throw new Error(
                            "आज की attendance पहले ही mark हो चुकी है."
                        );

                    }


                    attendance[today] =
                        "Present";


                    transaction.update(
                        studentRef,
                        {

                            attendance:
                                attendance,

                            lastAttendanceDate:
                                today,

                            lastAttendanceTime:
                                getCurrentTime(),

                            attendanceLatitude:
                                null,

                            attendanceLongitude:
                                null

                        }
                    );

                }
            );


            /* ======================================
               SUCCESS
            ====================================== */

            locationStatus.textContent =
                "✅ Attendance Marked Successfully";

            locationStatus.className =
                "success";


            locationMessage.innerHTML =
                "आज की attendance successfully mark हो गई।<br>" +
                "<b>" +
                currentStudent.name +
                "</b>";


            attendanceButton.textContent =
                "✅ ATTENDANCE MARKED";


            alert(
                "✅ Attendance Successfully Marked!"
            );


        }

        catch(error){

            console.error(
                "Attendance Error:",
                error
            );


            locationStatus.textContent =
                "⚠️ Attendance Not Marked";

            locationStatus.className =
                "error";


            locationMessage.innerHTML =
                error.message;


            attendanceButton.disabled = false;

            attendanceButton.textContent =
                "📍 MARK ATTENDANCE";

        }

    }
);

</script>

</body>
</html>
