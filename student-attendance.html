<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Attendance | Disha Computer Education</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* =====================================================
   STUDENT ATTENDANCE PAGE
===================================================== */

.student-attendance-page{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px 15px;

    background:
    linear-gradient(
        rgba(3,8,25,.88),
        rgba(3,8,25,.92)
    ),
    url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;

    background-position:center;

    background-attachment:fixed;

}


/* MAIN CARD */

.attendance-card{

    width:100%;

    max-width:520px;

    padding:35px;

    position:relative;

    overflow:hidden;

    background:
    linear-gradient(
        145deg,
        rgba(10,20,50,.96),
        rgba(5,10,30,.96)
    );

    border:1px solid rgba(0,229,255,.35);

    border-radius:28px;

    box-shadow:
        0 0 40px rgba(0,229,255,.12),
        0 25px 70px rgba(0,0,0,.5);

    color:white;

    text-align:center;

}


/* GLOW */

.attendance-card::before{

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    top:-120px;
    right:-100px;

    background:#00e5ff;

    opacity:.10;

    filter:blur(70px);

    border-radius:50%;

}


.attendance-card::after{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    bottom:-100px;
    left:-80px;

    background:#ff00cc;

    opacity:.08;

    filter:blur(70px);

    border-radius:50%;

}


/* HEADER */

.attendance-header{

    position:relative;

    z-index:2;

}


.attendance-icon{

    width:75px;
    height:75px;

    margin:0 auto 18px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:22px;

    font-size:35px;

    background:
    linear-gradient(
        135deg,
        #008cff,
        #00e5ff
    );

    box-shadow:
        0 0 30px rgba(0,229,255,.35);

    animation:
        attendanceFloat 3s ease-in-out infinite;

}


@keyframes attendanceFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}


.attendance-header h1{

    margin:0;

    font-size:28px;

    font-weight:800;

}


.attendance-header h1 span{

    color:#00e5ff;

    text-shadow:
        0 0 15px rgba(0,229,255,.45);

}


.attendance-header p{

    margin-top:8px;

    color:rgba(255,255,255,.62);

    font-size:13px;

}


/* STUDENT INFO */

.student-info{

    position:relative;

    z-index:2;

    margin-top:30px;

    padding:18px;

    border-radius:18px;

    background:
        rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.08);

    text-align:left;

}


.info-row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:8px 0;

}


.info-row:not(:last-child){

    border-bottom:
        1px solid rgba(255,255,255,.07);

}


.info-label{

    color:rgba(255,255,255,.55);

    font-size:12px;

}


.info-value{

    color:#fff;

    font-weight:700;

    font-size:13px;

}


/* LOCATION STATUS */

.location-box{

    position:relative;

    z-index:2;

    margin-top:20px;

    padding:18px;

    border-radius:18px;

    background:
        rgba(0,229,255,.05);

    border:
        1px solid rgba(0,229,255,.20);

}


.location-status{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    font-size:14px;

    font-weight:700;

}


.location-dot{

    width:11px;
    height:11px;

    border-radius:50%;

    background:#ffb300;

    box-shadow:
        0 0 12px #ffb300;

    animation:
        locationPulse 1.5s infinite;

}


@keyframes locationPulse{

    0%,100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.5);
        opacity:.5;
    }

}


.location-message{

    margin-top:8px;

    color:rgba(255,255,255,.55);

    font-size:11px;

}


/* ATTENDANCE BUTTON */

.mark-attendance-btn{

    position:relative;

    z-index:2;

    width:100%;

    height:58px;

    margin-top:25px;

    border:none;

    border-radius:16px;

    background:
        linear-gradient(
            90deg,
            #007bff,
            #00d9ff
        );

    color:#fff;

    font-size:16px;

    font-weight:800;

    letter-spacing:.5px;

    cursor:pointer;

    overflow:hidden;

    box-shadow:
        0 10px 30px rgba(0,170,255,.25);

    transition:
        transform .3s ease,
        box-shadow .3s ease;

}


.mark-attendance-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:80%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );

    transform:skewX(-20deg);

}


.mark-attendance-btn:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 15px 40px rgba(0,229,255,.35);

}


.mark-attendance-btn:hover::before{

    left:140%;

    transition:
        left .7s ease;

}


/* SECURITY TEXT */

.security-note{

    position:relative;

    z-index:2;

    margin-top:18px;

    padding:12px;

    border-radius:12px;

    background:
        rgba(255,255,255,.035);

    color:
        rgba(255,255,255,.48);

    font-size:11px;

    line-height:1.6;

}


/* MOBILE */

@media(max-width:600px){

    .student-attendance-page{

        padding:15px;

    }

    .attendance-card{

        padding:25px 18px;

        border-radius:22px;

    }

    .attendance-header h1{

        font-size:24px;

    }

    .attendance-icon{

        width:65px;
        height:65px;

        font-size:30px;

    }

}
      .mark-attendance-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    filter: grayscale(0.4);
}

.mark-attendance-btn.location-verified {
    animation: verifiedPulse 1.5s infinite;
}

@keyframes verifiedPulse {

    0% {
        box-shadow: 0 0 10px rgba(0,229,255,.3);
    }

    50% {
        box-shadow:
            0 0 25px rgba(0,229,255,.8),
            0 0 45px rgba(0,229,255,.3);
    }

    100% {
        box-shadow: 0 0 10px rgba(0,229,255,.3);
    }

}

</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

    /* =====================================================
       DISHA COMPUTER EDUCATION
       ADVANCED GPS CENTER VERIFICATION
    ===================================================== */

    // Google Maps Center Location
    const CENTER_LATITUDE = 26.7558402;
    const CENTER_LONGITUDE = 82.1374394;

    // Attendance allowed area
    const CENTER_RADIUS = 100; // meters

    // Maximum acceptable GPS uncertainty
    const MAX_GPS_ACCURACY = 100; // meters

    const button = document.getElementById("markAttendanceBtn");
    const status = document.getElementById("locationStatus");
    const message = document.getElementById("locationMessage");

    let bestLocation = null;
    let locationWatcher = null;
    let attempts = 0;

    /* =====================================================
       DISTANCE CALCULATION
    ===================================================== */

    function calculateDistance(lat1, lon1, lat2, lon2) {

        const R = 6371000;

        const dLat =
            (lat2 - lat1) * Math.PI / 180;

        const dLon =
            (lon2 - lon1) * Math.PI / 180;

        const a =
            Math.sin(dLat / 2) *
            Math.sin(dLat / 2) +

            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *

            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);

        const c =
            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );

        return R * c;
    }


    /* =====================================================
       RESET UI
    ===================================================== */

    function resetLocationUI() {

        status.textContent =
            "📡 Getting Accurate GPS Location...";

        message.innerHTML =
            "कृपया कुछ seconds wait करें।<br>" +
            "Phone का GPS आपकी exact location प्राप्त कर रहा है।";

        button.disabled = true;

        button.innerHTML =
            "📡 VERIFYING LOCATION...";

        button.classList.remove(
            "location-verified"
        );
    }


    /* =====================================================
       PROCESS GPS LOCATION
    ===================================================== */

    function processLocation(position) {

        const latitude =
            position.coords.latitude;

        const longitude =
            position.coords.longitude;

        const accuracy =
            position.coords.accuracy;


        const distance =
            calculateDistance(
                CENTER_LATITUDE,
                CENTER_LONGITUDE,
                latitude,
                longitude
            );


        console.log(
            "Latitude:",
            latitude
        );

        console.log(
            "Longitude:",
            longitude
        );

        console.log(
            "GPS Accuracy:",
            accuracy
        );

        console.log(
            "Distance:",
            distance
        );


        /* =================================================
           SHOW GPS INFORMATION
        ================================================= */

        const roundedAccuracy =
            Math.round(accuracy);

        const roundedDistance =
            Math.round(distance);


        /* =================================================
           GPS ACCURACY TOO LOW
        ================================================= */

        if (accuracy > MAX_GPS_ACCURACY) {

            status.textContent =
                "🟡 GPS Accuracy Low";

            message.innerHTML =
                "📡 GPS Accuracy: <b>" +
                roundedAccuracy +
                " meters</b><br><br>" +

                "GPS अभी accurate location नहीं दे रहा है।<br>" +

                "कृपया खुले स्थान में 10–20 seconds रुकें और GPS को location लेने दें।";

            button.disabled = true;

            button.innerHTML =
                "📡 WAITING FOR ACCURATE GPS";

            button.classList.remove(
                "location-verified"
            );

            return;
        }


        /* =================================================
           CENTER LOCATION VERIFIED
        ================================================= */

        if (distance <= CENTER_RADIUS) {

            status.textContent =
                "🟢 Center Location Verified";

            message.innerHTML =
                "📍 GPS Accuracy: <b>" +
                roundedAccuracy +
                " meters</b><br>" +

                "📏 Distance From Center: <b>" +
                roundedDistance +
                " meters</b><br><br>" +

                "✅ आप institute के allowed area में हैं।<br>" +
                "Attendance marking allowed.";

            button.disabled = false;

            button.innerHTML =
                "✅ MARK ATTENDANCE";

            button.classList.add(
                "location-verified"
            );

            // Best location save
            bestLocation = {
                latitude: latitude,
                longitude: longitude,
                accuracy: accuracy,
                distance: distance
            };

        }


        /* =================================================
           OUTSIDE CENTER
        ================================================= */

        else {

            status.textContent =
                "🔴 Outside Center Area";

            message.innerHTML =
                "📡 GPS Accuracy: <b>" +
                roundedAccuracy +
                " meters</b><br>" +

                "📏 Distance From Center: <b>" +
                roundedDistance +
                " meters</b><br><br>" +

                "❌ Attendance केवल institute के " +
                CENTER_RADIUS +
                " meter area में mark की जा सकती है।";

            button.disabled = true;

            button.innerHTML =
                "🔒 LOCATION NOT VERIFIED";

            button.classList.remove(
                "location-verified"
            );

        }

    }


    /* =====================================================
       GPS ERROR
    ===================================================== */

    function gpsError(error) {

        console.log(
            "GPS Error:",
            error
        );


        let errorMessage =
            "Location प्राप्त नहीं हो सकी।";


        if (error.code === 1) {

            errorMessage =
                "Location permission denied है।";

        }

        else if (error.code === 2) {

            errorMessage =
                "GPS location उपलब्ध नहीं है।";

        }

        else if (error.code === 3) {

            errorMessage =
                "GPS request timeout हो गया।";

        }


        status.textContent =
            "⚠️ Location Error";

        message.innerHTML =
            errorMessage +
            "<br><br>" +

            "कृपया Phone में <b>Location/GPS ON</b> करें और browser को location permission दें।";


        button.disabled = true;

        button.innerHTML =
            "📍 TRY LOCATION AGAIN";

        button.classList.remove(
            "location-verified"
        );

    }


    /* =====================================================
       GET CURRENT LOCATION
    ===================================================== */

    function getAccurateLocation() {

        resetLocationUI();

        attempts = 0;

        if (!navigator.geolocation) {

            status.textContent =
                "❌ GPS Not Supported";

            message.textContent =
                "आपके browser/device में GPS location support नहीं है।";

            return;
        }


        /* =================================================
           CONTINUOUS GPS WATCH
           इससे GPS को बेहतर accuracy मिलने का मौका मिलेगा
        ================================================= */

        locationWatcher =
            navigator.geolocation.watchPosition(

                function (position) {

                    attempts++;

                    console.log(
                        "GPS Attempt:",
                        attempts
                    );

                    processLocation(position);


                    /*
                       अगर अच्छी accuracy मिल गई
                       तो watcher बंद कर दें
                    */

                    if (
                        position.coords.accuracy <= 30 &&
                        bestLocation
                    ) {

                        navigator.geolocation.clearWatch(
                            locationWatcher
                        );

                        console.log(
                            "High accuracy GPS locked."
                        );

                    }

                },

                function (error) {

                    gpsError(error);

                },

                {

                    enableHighAccuracy: true,

                    timeout: 20000,

                    maximumAge: 0

                }

            );


        /*
           Maximum 30 seconds बाद GPS watcher बंद
        */

        setTimeout(function () {

            if (locationWatcher !== null) {

                navigator.geolocation.clearWatch(
                    locationWatcher
                );

                locationWatcher = null;

                console.log(
                    "GPS watcher stopped."
                );

            }

        }, 30000);

    }


    /* =====================================================
       ATTENDANCE BUTTON
    ===================================================== */

    button.addEventListener(
        "click",
        function () {

            if (button.disabled) {

                return;

            }


            if (!bestLocation) {

                alert(
                    "⚠️ पहले location verification पूरा होने दें।"
                );

                return;

            }


            alert(
                "📍 Location Verified!\n\n" +

                "Distance: " +
                Math.round(
                    bestLocation.distance
                ) +
                " meters\n" +

                "GPS Accuracy: " +
                Math.round(
                    bestLocation.accuracy
                ) +
                " meters\n\n" +

                "अब अगला security verification step शुरू होगा।"
            );

        }
    );


    /* =====================================================
       START GPS CHECK
    ===================================================== */

    getAccurateLocation();

});
</script>

      <script type="module">

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   FIREBASE AUTH
========================================= */

const auth = getAuth();


/* =========================================
   PAGE ELEMENTS
========================================= */

const studentIdBox =
    document.getElementById("studentId");

const studentNameBox =
    document.getElementById("studentName");

const studentCourseBox =
    document.getElementById("studentCourse");

const locationStatus =
    document.getElementById("locationStatus");

const locationMessage =
    document.getElementById("locationMessage");

const attendanceButton =
    document.getElementById("markAttendanceBtn");


/* =========================================
   STUDENT ACCOUNT VERIFICATION
========================================= */

onAuthStateChanged(auth, async function(user) {

    /* -----------------------------------------
       LOGIN CHECK
    ----------------------------------------- */

    if (!user) {

        console.log(
            "❌ Student is not logged in"
        );

        studentIdBox.textContent = "Not Logged In";
        studentNameBox.textContent = "—";
        studentCourseBox.textContent = "—";

        attendanceButton.disabled = true;

        locationStatus.textContent =
            "🔐 Student Login Required";

        locationMessage.innerHTML =
            "Attendance mark करने से पहले <b>Student Login</b> करना जरूरी है।";

        setTimeout(function() {

            window.location.href =
                "student-login.html";

        }, 1500);

        return;
    }


    console.log(
        "✅ Firebase User:",
        user.uid
    );


    /* -----------------------------------------
       FIRESTORE DATABASE
    ----------------------------------------- */

    const db =
        window.studentAttendanceDB;


    if (!db) {

        console.error(
            "❌ Firestore database not available"
        );

        locationStatus.textContent =
            "❌ Database Error";

        locationMessage.textContent =
            "Firebase database connection नहीं मिल पाया।";

        attendanceButton.disabled = true;

        return;
    }


    try {

        /* -----------------------------------------
           FIND STUDENT ACCOUNT BY UID
        ----------------------------------------- */

        const studentQuery = query(

            collection(
                db,
                "studentAccounts"
            ),

            where(
                "uid",
                "==",
                user.uid
            )

        );


        const snapshot =
            await getDocs(studentQuery);


        /* -----------------------------------------
           STUDENT NOT FOUND
        ----------------------------------------- */

        if (snapshot.empty) {

            console.error(
                "❌ Student account not found"
            );

            studentIdBox.textContent =
                "Not Found";

            studentNameBox.textContent =
                "—";

            studentCourseBox.textContent =
                "—";

            attendanceButton.disabled =
                true;

            locationStatus.textContent =
                "❌ Student Verification Failed";

            locationMessage.innerHTML =
                "आपका student account Firebase में verify नहीं हो पाया।";

            return;
        }


        /* -----------------------------------------
           STUDENT FOUND
        ----------------------------------------- */

        const studentDoc =
            snapshot.docs[0];

        const student =
            studentDoc.data();


        console.log(
            "✅ Student Verified:",
            student
        );


        /* -----------------------------------------
           SHOW STUDENT INFORMATION
        ----------------------------------------- */

        studentIdBox.textContent =
            student.studentId || "—";

        studentNameBox.textContent =
            student.name || "—";

        studentCourseBox.textContent =
            student.course || "—";


        /* -----------------------------------------
           SAVE VERIFIED STUDENT
           FOR NEXT ATTENDANCE STEP
        ----------------------------------------- */

        window.loggedInStudent = {

            uid:
                user.uid,

            studentId:
                student.studentId || "",

            name:
                student.name || "",

            course:
                student.course || "",

            email:
                student.email || "",

            mobile:
                student.mobile || "",

            batch:
                student.batch || "",

            father:
                student.father || "",

            accountDocumentId:
                studentDoc.id

        };


        console.log(
            "✅ Student verification complete"
        );

        console.log(
            "Student ID:",
            window.loggedInStudent.studentId
        );

        console.log(
            "Student Name:",
            window.loggedInStudent.name
        );

        console.log(
            "Student Course:",
            window.loggedInStudent.course
        );


        /* -----------------------------------------
           VERIFIED MESSAGE
        ----------------------------------------- */

        locationMessage.innerHTML =
            "👤 Student account verified successfully.<br>" +
            "अब GPS verification complete होने के बाद attendance mark की जा सकेगी।";


    }

    catch (error) {

        console.error(
            "Student verification error:",
            error
        );

        locationStatus.textContent =
            "❌ Verification Error";

        locationMessage.innerHTML =
            "Student verification के दौरान समस्या हुई।<br>" +
            "Please try again.";

        attendanceButton.disabled =
            true;

    }

});

<script type="module">

import {
    collection,
    query,
    where,
    getDocs,
    doc,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FINAL ATTENDANCE SAVE SYSTEM
===================================================== */

const button =
    document.getElementById("markAttendanceBtn");

const status =
    document.getElementById("locationStatus");

const message =
    document.getElementById("locationMessage");


/* =====================================================
   CENTER SETTINGS
===================================================== */

const CENTER_LATITUDE = 26.7558402;
const CENTER_LONGITUDE = 82.1374394;

const CENTER_RADIUS = 100;


/* =====================================================
   DISTANCE CALCULATOR
===================================================== */

function calculateDistance(lat1, lon1, lat2, lon2) {

    const R = 6371000;

    const dLat =
        (lat2 - lat1) * Math.PI / 180;

    const dLon =
        (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +

        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(dLon / 2) ** 2;

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}


/* =====================================================
   DATE
===================================================== */

function getTodayDate() {

    const now = new Date();

    return (
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0")
    );
}


/* =====================================================
   TIME
===================================================== */

function getCurrentTime() {

    return new Date().toLocaleTimeString(
        "en-IN",
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        }
    );
}


/* =====================================================
   FRESH GPS
===================================================== */

function getFreshGPS() {

    return new Promise((resolve, reject) => {

        if (!navigator.geolocation) {

            reject(
                new Error("GPS_NOT_SUPPORTED")
            );

            return;
        }

        navigator.geolocation.getCurrentPosition(

            position => {

                resolve(position);

            },

            error => {

                reject(error);

            },

            {
                enableHighAccuracy: true,
                timeout: 30000,
                maximumAge: 0
            }

        );

    });
}


/* =====================================================
   MARK ATTENDANCE
===================================================== */

async function markAttendance() {

    const student =
        window.loggedInStudent;

    const db =
        window.studentAttendanceDB;


    /* ---------------------------------------------
       STUDENT CHECK
    --------------------------------------------- */

    if (!student) {

        alert(
            "❌ Student verification नहीं हुई है।"
        );

        return;
    }


    /* ---------------------------------------------
       FIREBASE CHECK
    --------------------------------------------- */

    if (!db) {

        alert(
            "❌ Firebase database connected नहीं है।"
        );

        return;
    }


    button.disabled = true;

    button.innerHTML =
        "📡 VERIFYING LOCATION...";


    status.textContent =
        "📡 Verifying Location...";

    message.innerHTML =
        "Attendance से पहले आपकी current location दोबारा verify की जा रही है।";


    try {

        /* =========================================
           GET CURRENT GPS
        ========================================= */

        const position =
            await getFreshGPS();


        const latitude =
            position.coords.latitude;

        const longitude =
            position.coords.longitude;

        const accuracy =
            position.coords.accuracy;


        console.log(
            "Attendance GPS:",
            latitude,
            longitude
        );

        console.log(
            "Attendance GPS Accuracy:",
            accuracy
        );


        /* =========================================
           ACCURACY CHECK

           Testing के दौरान 1500m जैसी खराब
           accuracy पर system रोक देगा.
        ========================================= */

        if (accuracy > 150) {

            status.textContent =
                "⚠️ GPS Accuracy Low";

            message.innerHTML =
                "GPS Accuracy: <b>" +
                Math.round(accuracy) +
                " meters</b><br><br>" +

                "GPS अभी accurate नहीं है। कुछ seconds बाद दोबारा button दबाएँ।";

            button.disabled = false;

            button.innerHTML =
                "🔄 TRY AGAIN";

            return;
        }


        /* =========================================
           DISTANCE
        ========================================= */

        const distance =
            calculateDistance(
                CENTER_LATITUDE,
                CENTER_LONGITUDE,
                latitude,
                longitude
            );


        console.log(
            "Distance From Center:",
            distance
        );


        /* =========================================
           CENTER CHECK
        ========================================= */

        if (distance > CENTER_RADIUS) {

            status.textContent =
                "🔴 Outside Center Area";

            message.innerHTML =
                "आप center से लगभग <b>" +
                Math.round(distance) +
                " meters</b> दूर हैं।<br><br>" +

                "Attendance केवल center के " +
                CENTER_RADIUS +
                " meter area में mark की जा सकती है।";

            button.disabled = false;

            button.innerHTML =
                "🔄 TRY AGAIN";

            return;
        }


        /* =========================================
           FIND STUDENT IN students COLLECTION
           
           IMPORTANT:
           studentAccounts और students के
           document IDs अलग हो सकते हैं।
        ========================================= */

        status.textContent =
            "🔐 Verifying Student...";

        message.innerHTML =
            "Student record Firebase में verify किया जा रहा है...";


        const studentQuery =
            query(
                collection(db, "students"),
                where(
                    "studentId",
                    "==",
                    student.studentId
                )
            );


        const studentSnapshot =
            await getDocs(studentQuery);


        /* =========================================
           STUDENT RECORD NOT FOUND
        ========================================= */

        if (studentSnapshot.empty) {

            status.textContent =
                "❌ Student Record Not Found";

            message.innerHTML =
                "Student ID <b>" +
                student.studentId +
                "</b> का attendance record नहीं मिला।";

            button.disabled = false;

            button.innerHTML =
                "🔄 TRY AGAIN";

            console.error(
                "No students document found for:",
                student.studentId
            );

            return;
        }


        /* =========================================
           STUDENTS DOCUMENT
        ========================================= */

        const studentDoc =
            studentSnapshot.docs[0];

        const studentRef =
            studentDoc.ref;


        /* =========================================
           DATE & TIME
        ========================================= */

        const today =
            getTodayDate();

        const currentTime =
            getCurrentTime();


        /* =========================================
           FIRESTORE TRANSACTION
        ========================================= */

        const result =
            await runTransaction(

                db,

                async transaction => {

                    const latestSnapshot =
                        await transaction.get(
                            studentRef
                        );


                    if (
                        !latestSnapshot.exists()
                    ) {

                        throw new Error(
                            "STUDENT_NOT_FOUND"
                        );

                    }


                    const data =
                        latestSnapshot.data();


                    const attendance =
                        data.attendance || {};


                    /* ---------------------------------
                       DUPLICATE CHECK
                    --------------------------------- */

                    if (
                        attendance[today] ===
                        "Present"
                    ) {

                        return {
                            alreadyMarked: true
                        };

                    }


                    /* ---------------------------------
                       SAVE PRESENT
                    --------------------------------- */

                    attendance[today] =
                        "Present";


                    transaction.update(

                        studentRef,

                        {
                            attendance:
                                attendance
                        }

                    );


                    return {
                        alreadyMarked: false
                    };

                }

            );


        /* =========================================
           ALREADY MARKED
        ========================================= */

        if (
            result.alreadyMarked
        ) {

            status.textContent =
                "🟡 Already Marked";

            message.innerHTML =
                "आज की attendance पहले से <b>Present</b> है।<br><br>" +

                "📅 Date: <b>" +
                today +
                "</b>";

            button.disabled = true;

            button.innerHTML =
                "✓ TODAY'S ATTENDANCE DONE";

            return;
        }


        /* =========================================
           SUCCESS
        ========================================= */

        status.textContent =
            "🟢 Attendance Marked Successfully";

        message.innerHTML =

            "🎉 Attendance successfully save हो गई!<br><br>" +

            "👤 Student: <b>" +
            student.name +
            "</b><br>" +

            "🆔 Student ID: <b>" +
            student.studentId +
            "</b><br>" +

            "📚 Course: <b>" +
            student.course +
            "</b><br>" +

            "📅 Date: <b>" +
            today +
            "</b><br>" +

            "⏰ Time: <b>" +
            currentTime +
            "</b><br>" +

            "📍 Distance: <b>" +
            Math.round(distance) +
            " meters</b><br>" +

            "📡 GPS Accuracy: <b>" +
            Math.round(accuracy) +
            " meters</b>";


        button.disabled = true;

        button.innerHTML =
            "✅ ATTENDANCE MARKED";

        button.classList.add(
            "location-verified"
        );


        alert(
            "✅ Attendance Successfully Marked!\n\n" +

            "Student: " +
            student.name +

            "\nStudent ID: " +
            student.studentId +

            "\nDate: " +
            today +

            "\nTime: " +
            currentTime
        );


    }

    catch (error) {

        console.error(
            "FINAL ATTENDANCE ERROR:",
            error
        );


        status.textContent =
            "❌ Attendance Failed";

        message.innerHTML =
            "Attendance save नहीं हो सकी।<br><br>" +

            "<small>" +
            error.message +
            "</small>";


        button.disabled = false;

        button.innerHTML =
            "🔄 TRY AGAIN";

    }

}


/* =====================================================
   BUTTON EVENT
===================================================== */

button.addEventListener(
    "click",
    markAttendance
);

</script>
      
</body>

</html>
