<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Attendance | Disha Computer Education</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<nav>

<div class="logo">

<i class="fa-solid fa-graduation-cap"></i>

DISHA COMPUTER EDUCATION

</div>

<ul>

<li><a href="student-dashboard.html">Dashboard</a></li>

<li><a href="study.html">Study Portal</a></li>

</ul>

</nav>



<section class="hero">

<div class="glass attendance-page">

<h1>

<i class="fa-solid fa-calendar-check"></i>

Student Attendance

</h1>

<p>

View your attendance details below

</p>

</div>

  <div class="attendance-container">

    <!-- Student Information -->
    <div class="student-info">

        <h2 id="studentName"></h2>

        <p><strong>Student ID :</strong> <span id="studentId"></span></p>

        <p><strong>Course :</strong> <span id="course"></span></p>

        <p><strong>Batch :</strong> <span id="batch"></span></p>

    </div>

    <!-- Attendance Summary -->

    <div class="attendance-cards">

        <div class="att-card">
            <h3>Total Classes</h3>
            <h1 id="totalClasses"></h1>
        </div>

        <div class="att-card">
            <h3>Present</h3>
            <h1 id="presentClasses"></h1>
        </div>

        <div class="att-card">
            <h3>Absent</h3>
            <h1 id="absentClasses"></h1>
        </div>

        <div class="att-card">
            <h3>Attendance %</h3>
            <h1 id="attendancePercent"></h1>
        </div>

    </div>

</div>

</section>
  <script src="js/student-attendance.js"></script>

</body>

</html>
