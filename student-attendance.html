<style>

/* =====================================================
   STUDENT ATTENDANCE PAGE
===================================================== */

.student-attendance-page{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px 15px;

    background:
    linear-gradient(
        rgba(3,8,25,.88),
        rgba(3,8,25,.92)
    ),
    url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;

    background-position:center;

    background-attachment:fixed;

}


/* MAIN CARD */

.attendance-card{

    width:100%;

    max-width:520px;

    padding:35px;

    position:relative;

    overflow:hidden;

    background:
    linear-gradient(
        145deg,
        rgba(10,20,50,.96),
        rgba(5,10,30,.96)
    );

    border:1px solid rgba(0,229,255,.35);

    border-radius:28px;

    box-shadow:
        0 0 40px rgba(0,229,255,.12),
        0 25px 70px rgba(0,0,0,.5);

    color:white;

    text-align:center;

}


/* GLOW */

.attendance-card::before{

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    top:-120px;
    right:-100px;

    background:#00e5ff;

    opacity:.10;

    filter:blur(70px);

    border-radius:50%;

}


.attendance-card::after{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    bottom:-100px;
    left:-80px;

    background:#ff00cc;

    opacity:.08;

    filter:blur(70px);

    border-radius:50%;

}


/* HEADER */

.attendance-header{

    position:relative;

    z-index:2;

}


.attendance-icon{

    width:75px;
    height:75px;

    margin:0 auto 18px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:22px;

    font-size:35px;

    background:
    linear-gradient(
        135deg,
        #008cff,
        #00e5ff
    );

    box-shadow:
        0 0 30px rgba(0,229,255,.35);

    animation:
        attendanceFloat 3s ease-in-out infinite;

}


@keyframes attendanceFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}


.attendance-header h1{

    margin:0;

    font-size:28px;

    font-weight:800;

}


.attendance-header h1 span{

    color:#00e5ff;

    text-shadow:
        0 0 15px rgba(0,229,255,.45);

}


.attendance-header p{

    margin-top:8px;

    color:rgba(255,255,255,.62);

    font-size:13px;

}


/* STUDENT INFO */

.student-info{

    position:relative;

    z-index:2;

    margin-top:30px;

    padding:18px;

    border-radius:18px;

    background:
        rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.08);

    text-align:left;

}


.info-row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:8px 0;

}


.info-row:not(:last-child){

    border-bottom:
        1px solid rgba(255,255,255,.07);

}


.info-label{

    color:rgba(255,255,255,.55);

    font-size:12px;

}


.info-value{

    color:#fff;

    font-weight:700;

    font-size:13px;

}


/* LOCATION STATUS */

.location-box{

    position:relative;

    z-index:2;

    margin-top:20px;

    padding:18px;

    border-radius:18px;

    background:
        rgba(0,229,255,.05);

    border:
        1px solid rgba(0,229,255,.20);

}


.location-status{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    font-size:14px;

    font-weight:700;

}


.location-dot{

    width:11px;
    height:11px;

    border-radius:50%;

    background:#ffb300;

    box-shadow:
        0 0 12px #ffb300;

    animation:
        locationPulse 1.5s infinite;

}


@keyframes locationPulse{

    0%,100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.5);
        opacity:.5;
    }

}


.location-message{

    margin-top:8px;

    color:rgba(255,255,255,.55);

    font-size:11px;

}


/* ATTENDANCE BUTTON */

.mark-attendance-btn{

    position:relative;

    z-index:2;

    width:100%;

    height:58px;

    margin-top:25px;

    border:none;

    border-radius:16px;

    background:
        linear-gradient(
            90deg,
            #007bff,
            #00d9ff
        );

    color:#fff;

    font-size:16px;

    font-weight:800;

    letter-spacing:.5px;

    cursor:pointer;

    overflow:hidden;

    box-shadow:
        0 10px 30px rgba(0,170,255,.25);

    transition:
        transform .3s ease,
        box-shadow .3s ease;

}


.mark-attendance-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:80%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45),

.mark-attendance-btn:hover{

.mark-attendance-btn:hover::before{

/* SECURITY TEXT */

.security-note{

    padding:12px;

    background:
        rgba(255,255,255,.035);

    color:

    line-height:1.6;

/* MOBILE */

@media(max-width:600px){

    }

    .attendance-icon{

        width:65px;

      .mark-attendance-btn:disabled {

.mark-attendance-btn.location-verified {

    100% {

}

<script>
document.addEventListener("DOMContentLoaded", function () {

    /* =====================================================
       DISHA COMPUTER EDUCATION
       ADVANCED GPS CENTER VERIFICATION
    ===================================================== */

    // Google Maps Center Location
    const CENTER_LATITUDE = 26.7558402;
    const CENTER_LONGITUDE = 82.1374394;

    // Attendance allowed area
    const CENTER_RADIUS = 100; // meters

    // Maximum acceptable GPS uncertainty
    const MAX_GPS_ACCURACY = 100; // meters

    const button = document.getElementById("markAttendanceBtn");
    const status = document.getElementById("locationStatus");
    const message = document.getElementById("locationMessage");

    let bestLocation = null;
    let locationWatcher = null;
    let attempts = 0;

    /* =====================================================
       DISTANCE CALCULATION
    ===================================================== */

    function calculateDistance(lat1, lon1, lat2, lon2) {

        const R = 6371000;

        const dLat =
            (lat2 - lat1) * Math.PI / 180;

        const dLon =
            (lon2 - lon1) * Math.PI / 180;

        const a =
            Math.sin(dLat / 2) *
            Math.sin(dLat / 2) +

            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *

            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);

        const c =
            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );

        return R * c;
    }


    /* =====================================================
       RESET UI
    ===================================================== */

    function resetLocationUI() {

        status.textContent =
            "📡 Getting Accurate GPS Location...";

        message.innerHTML =
            "कृपया कुछ seconds wait करें।<br>" +
            "Phone का GPS आपकी exact location प्राप्त कर रहा है।";

        button.disabled = true;

        button.innerHTML =
            "📡 VERIFYING LOCATION...";

        button.classList.remove(
            "location-verified"
        );
    }


    /* =====================================================
       PROCESS GPS LOCATION
    ===================================================== */

    function processLocation(position) {

        const latitude =
            position.coords.latitude;

        const longitude =
            position.coords.longitude;

        const accuracy =
            position.coords.accuracy;


        const distance =
            calculateDistance(
                CENTER_LATITUDE,
                CENTER_LONGITUDE,
                latitude,
                longitude
            );


        console.log(
            "Latitude:",
            latitude
        );

        console.log(
            "Longitude:",
            longitude
        );

        console.log(
            "GPS Accuracy:",
            accuracy
        );

        console.log(
            "Distance:",
            distance
        );


        /* =================================================
           SHOW GPS INFORMATION
        ================================================= */

        const roundedAccuracy =
            Math.round(accuracy);

        const roundedDistance =
            Math.round(distance);


        /* =================================================
           GPS ACCURACY TOO LOW
        ================================================= */

        if (accuracy > MAX_GPS_ACCURACY) {

            status.textContent =
                "🟡 GPS Accuracy Low";

            message.innerHTML =
                "📡 GPS Accuracy: <b>" +
                roundedAccuracy +
                " meters</b><br><br>" +

                "GPS अभी accurate location नहीं दे रहा है।<br>" +

                "कृपया खुले स्थान में 10–20 seconds रुकें और GPS को location लेने दें।";

            button.disabled = true;

            button.innerHTML =
                "📡 WAITING FOR ACCURATE GPS";

            button.classList.remove(
                "location-verified"
            );

            return;
        }


        /* =================================================
           CENTER LOCATION VERIFIED
        ================================================= */

        if (distance <= CENTER_RADIUS) {

            status.textContent =
                "🟢 Center Location Verified";

            message.innerHTML =
                "📍 GPS Accuracy: <b>" +
                roundedAccuracy +
                " meters</b><br>" +

                "📏 Distance From Center: <b>" +
                roundedDistance +
                " meters</b><br><br>" +

                "✅ आप institute के allowed area में हैं।<br>" +
                "Attendance marking allowed.";

            button.disabled = false;

            button.innerHTML =
                "✅ MARK ATTENDANCE";

            button.classList.add(
                "location-verified"
            );

            // Best location save
            bestLocation = {
                latitude: latitude,
                longitude: longitude,
                accuracy: accuracy,
                distance: distance
            };

        }


        /* =================================================
           OUTSIDE CENTER
        ================================================= */

        else {

            status.textContent =
                "🔴 Outside Center Area";

            message.innerHTML =
                "📡 GPS Accuracy: <b>" +
                roundedAccuracy +
                " meters</b><br>" +

                "📏 Distance From Center: <b>" +
                roundedDistance +
                " meters</b><br><br>" +

                "❌ Attendance केवल institute के " +
                CENTER_RADIUS +
                " meter area में mark की जा सकती है।";

            button.disabled = true;

            button.innerHTML =
                "🔒 LOCATION NOT VERIFIED";

            button.classList.remove(
                "location-verified"
            );

        }

    }


    /* =====================================================
       GPS ERROR
    ===================================================== */

    function gpsError(error) {

        console.log(
            "GPS Error:",
            error
        );


        let errorMessage =
            "Location प्राप्त नहीं हो सकी।";


        if (error.code === 1) {

            errorMessage =
                "Location permission denied है।";

        }

        else if (error.code === 2) {

            errorMessage =
                "GPS location उपलब्ध नहीं है।";

        }

        else if (error.code === 3) {

            errorMessage =
                "GPS request timeout हो गया।";

        }


        status.textContent =
            "⚠️ Location Error";

        message.innerHTML =
            errorMessage +
            "<br><br>" +

            "कृपया Phone में <b>Location/GPS ON</b> करें और browser को location permission दें।";


        button.disabled = true;

        button.innerHTML =
            "📍 TRY LOCATION AGAIN";

        button.classList.remove(
            "location-verified"
        );

    }


    /* =====================================================
       GET CURRENT LOCATION
    ===================================================== */

    function getAccurateLocation() {

        resetLocationUI();

        attempts = 0;

        if (!navigator.geolocation) {

            status.textContent =
                "❌ GPS Not Supported";

            message.textContent =
                "आपके browser/device में GPS location support नहीं है।";

            return;
        }


        /* =================================================
           CONTINUOUS GPS WATCH
           इससे GPS को बेहतर accuracy मिलने का मौका मिलेगा
        ================================================= */

        locationWatcher =
            navigator.geolocation.watchPosition(

                function (position) {

                    attempts++;

                    console.log(
                        "GPS Attempt:",
                        attempts
                    );

                    processLocation(position);


                    /*
                       अगर अच्छी accuracy मिल गई
                       तो watcher बंद कर दें
                    */

                    if (
                        position.coords.accuracy <= 30 &&
                        bestLocation
                    ) {

                        navigator.geolocation.clearWatch(
                            locationWatcher
                        );

                        console.log(
                            "High accuracy GPS locked."
                        );

                    }

                },

                function (error) {

                    gpsError(error);

                },

                {

                    enableHighAccuracy: true,

                    timeout: 20000,

                    maximumAge: 0

                }

            );


        /*
           Maximum 30 seconds बाद GPS watcher बंद
        */

        setTimeout(function () {

            if (locationWatcher !== null) {

                navigator.geolocation.clearWatch(
                    locationWatcher
                );

                locationWatcher = null;

                console.log(
                    "GPS watcher stopped."
                );

            }

        }, 30000);

    }


    /* =====================================================
       ATTENDANCE BUTTON
    ===================================================== */

    button.addEventListener(
        "click",
        function () {

            if (button.disabled) {

                return;

            }


            if (!bestLocation) {

                alert(
                    "⚠️ पहले location verification पूरा होने दें।"
                );

                return;

            }


            alert(
                "📍 Location Verified!\n\n" +

                "Distance: " +
                Math.round(
                    bestLocation.distance
                ) +
                " meters\n" +

                "GPS Accuracy: " +
                Math.round(
                    bestLocation.accuracy
                ) +
                " meters\n\n" +

                "अब अगला security verification step शुरू होगा।"
            );

        }
    );


    /* =====================================================
       START GPS CHECK
    ===================================================== */

    getAccurateLocation();

});
</script>

           FIND STUDENT ACCOUNT
        ================================================= */

        try {

            const studentQuery =
                query(

                    collection(
                        db,
                        "studentAccounts"
                    ),

                    where(
                        "uid",
                        "==",
                        user.uid
                    )

                );


            const snapshot =
                await getDocs(
                    studentQuery
                );


            console.log(
                "Student Account Count:",
                snapshot.size
            );


            /* =================================================
               IF UID RECORD NOT FOUND

               FALLBACK:
               SEARCH USING EMAIL
            ================================================= */

            if (snapshot.empty) {

                console.log(
                    "UID record not found. Trying email..."
                );


                if (!user.email) {

                    throw new Error(
                        "Student account could not be verified."
                    );

                }


                const emailQuery =
                    query(

                        collection(
                            db,
                            "studentAccounts"
                        ),

                        where(
                            "email",
                            "==",
                            user.email
                        )

                    );


                const emailSnapshot =
                    await getDocs(
                        emailQuery
                    );


                if (
                    emailSnapshot.empty
                ) {

                    throw new Error(
                        "Student record Firebase में नहीं मिला।"
                    );

                }


                await loadStudent(
                    emailSnapshot.docs[0].data(),
                    user
                );

            }

            else {

                await loadStudent(
                    snapshot.docs[0].data(),
                    user
                );

            }

        }

        catch(error) {

            console.error(
                "STUDENT LOAD ERROR:",
                error
            );

            studentIdBox.textContent =
                "Not Found";

            studentNameBox.textContent =
                "—";

            studentCourseBox.textContent =
                "—";

            locationStatus.textContent =
                "❌ Student Verification Failed";

            locationMessage.innerHTML =
                error.message;

            attendanceButton.disabled =
                true;

            attendanceButton.innerHTML =
                "❌ VERIFICATION FAILED";

        }

    }
);


/* =========================================================
   LOAD STUDENT
========================================================= */

async function loadStudent(
    data,
    user
) {

    console.log(
        "STUDENT DATA:",
        data
    );


    /* =====================================================
       SAVE STUDENT DATA
    ===================================================== */

    currentStudent = {

        uid:
            user.uid,

        studentId:
            String(
                data.studentId ||
                data.roll ||
                data.rollNo ||
                ""
            ).trim(),

        name:
            data.name ||
            data.studentName ||
            "",

        course:
            data.course ||
            data.selectedCourse ||
            "",

        email:
            data.email ||
            user.email ||
            "",

        mobile:
            data.mobile ||
            "",

        batch:
            data.batch ||
            ""

    };


    console.log(
        "CURRENT STUDENT:",
        currentStudent
    );


    /* =====================================================
       DISPLAY STUDENT INFORMATION
    ===================================================== */

    studentIdBox.textContent =
        currentStudent.studentId ||
        "—";

    studentNameBox.textContent =
        currentStudent.name ||
        "—";

    studentCourseBox.textContent =
        currentStudent.course ||
        "—";


    /* =====================================================
       CHECK DATA
    ===================================================== */

    if (
        !currentStudent.studentId ||
        !currentStudent.name ||
        !currentStudent.course
    ) {

        locationStatus.textContent =
            "⚠️ Student Data Incomplete";

        locationMessage.innerHTML =
            "Firebase student profile में Student ID, Name या Course missing है।";

        attendanceButton.disabled =
            true;

        attendanceButton.innerHTML =
            "⚠️ PROFILE INCOMPLETE";

        return;

    }


    /* =====================================================
       STUDENT VERIFIED
    ===================================================== */

    locationStatus.textContent =
        "🟢 Student Verified";

    locationMessage.innerHTML =
        "👤 <b>" +
        currentStudent.name +
        "</b><br>" +

        "Student ID: <b>" +
        currentStudent.studentId +
        "</b><br>" +

        "Course: <b>" +
        currentStudent.course +
        "</b><br><br>" +

        "अब center location verify की जा रही है...";


    /* =====================================================
       START GPS
    ===================================================== */

    startGPS();

}


/* =========================================================
   START GPS
========================================================= */

function startGPS() {

    if (!navigator.geolocation) {

        locationStatus.textContent =
            "❌ GPS Not Supported";

        locationMessage.textContent =
            "इस device/browser में GPS उपलब्ध नहीं है।";

        return;

    }


    locationStatus.textContent =
        "📡 Checking Center Location...";

    locationMessage.innerHTML =
        "आपकी current GPS location verify की जा रही है...";

    attendanceButton.disabled =
        true;

    attendanceButton.innerHTML =
        "📡 VERIFYING LOCATION...";


    navigator.geolocation.watchPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            const distance =
                calculateDistance(

                    CENTER_LATITUDE,

                    CENTER_LONGITUDE,

                    latitude,

                    longitude

                );


            console.log(
                "LAT:",
                latitude
            );

            console.log(
                "LNG:",
                longitude
            );

            console.log(
                "ACCURACY:",
                accuracy
            );

            console.log(
                "DISTANCE:",
                distance
            );


            /* =============================================
               GPS ACCURACY
            ============================================= */

            if (
                accuracy >
                MAX_GPS_ACCURACY
            ) {

                locationStatus.textContent =
                    "🟡 GPS Accuracy Low";

                locationMessage.innerHTML =
                    "GPS Accuracy: <b>" +
                    Math.round(accuracy) +
                    " meters</b><br><br>" +

                    "कृपया कुछ seconds wait करें।";

                attendanceButton.disabled =
                    true;

                attendanceButton.innerHTML =
                    "📡 WAITING FOR GPS";

                return;

            }


            /* =============================================
               INSIDE CENTER
            ============================================= */

            if (
                distance <=
                CENTER_RADIUS
            ) {

                verifiedLocation = {

                    latitude:
                        latitude,

                    longitude:
                        longitude,

                    accuracy:
                        accuracy,

                    distance:
                        distance

                };


                locationStatus.textContent =
                    "🟢 Center Location Verified";

                locationMessage.innerHTML =

                    "📡 GPS Accuracy: <b>" +
                    Math.round(accuracy) +
                    "m</b><br>" +

                    "📏 Distance: <b>" +
                    Math.round(distance) +
                    "m</b><br><br>" +

                    "✅ आप center के अंदर हैं।<br>" +

                    "Attendance marking allowed.";


                attendanceButton.disabled =
                    false;

                attendanceButton.innerHTML =
                    "✅ MARK ATTENDANCE";

                attendanceButton.classList.add(
                    "location-verified"
                );

            }


            /* =============================================
               OUTSIDE CENTER
            ============================================= */

            else {

                verifiedLocation =
                    null;

                locationStatus.textContent =
                    "🔴 Outside Center Area";

                locationMessage.innerHTML =

                    "📏 Distance: <b>" +
                    Math.round(distance) +
                    " meters</b><br><br>" +

                    "❌ Attendance केवल institute के " +
                    CENTER_RADIUS +
                    " meter area में mark की जा सकती है।";

                attendanceButton.disabled =
                    true;

                attendanceButton.innerHTML =
                    "🔒 LOCATION NOT VERIFIED";

                attendanceButton.classList.remove(
                    "location-verified"
                );

            }

        },

        function(error) {

            console.error(
                "GPS ERROR:",
                error
            );


            locationStatus.textContent =
                "⚠️ GPS Error";

            locationMessage.innerHTML =
                "Phone में <b>Location/GPS ON</b> करें और browser को location permission दें।";

            attendanceButton.disabled =
                true;

            attendanceButton.innerHTML =
                "📍 LOCATION REQUIRED";

        },

        {

            enableHighAccuracy:
                true,

            timeout:
                30000,

            maximumAge:
                0

        }

    );

}


/* =========================================================
   MARK ATTENDANCE
========================================================= */

attendanceButton.addEventListener(
    "click",
    async function() {

        if (
            !currentStudent
        ) {

            alert(
                "❌ Student verification नहीं हुई।"
            );

            return;

        }


        if (
            !verifiedLocation
        ) {

            alert(
                "❌ Center location verify नहीं हुई।"
            );

            return;

        }


        attendanceButton.disabled =
            true;

        attendanceButton.innerHTML =
            "⏳ SAVING ATTENDANCE...";

        locationStatus.textContent =
            "⏳ Saving Attendance...";


        try {

            /* =============================================
               FINAL GPS CHECK
            ============================================= */

            const position =
                await new Promise(
                    function(resolve, reject) {

                        navigator.geolocation
                            .getCurrentPosition(

                                resolve,

                                reject,

                                {
                                    enableHighAccuracy:
                                        true,

                                    timeout:
                                        30000,

                                    maximumAge:
                                        0
                                }

                            );

                    }
                );


            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            const distance =
                calculateDistance(

                    CENTER_LATITUDE,

                    CENTER_LONGITUDE,

                    latitude,

                    longitude

                );


            /* =============================================
               FINAL SECURITY CHECK
            ============================================= */

            if (
                accuracy >
                MAX_GPS_ACCURACY
            ) {

                throw new Error(
                    "GPS accuracy बहुत कम है।"
                );

            }


            if (
                distance >
                CENTER_RADIUS
            ) {

                throw new Error(
                    "आप center area से बाहर हैं।"
                );

            }


            /* =============================================
               TODAY
            ============================================= */

            const today =
                getTodayDate();

            const currentTime =
                getCurrentTime();


            /* =============================================
               FIND STUDENT RECORD
            ============================================= */

            const studentQuery =
                query(

                    collection(
                        db,
                        "students"
                    ),

                    where(
                        "studentId",
                        "==",
                        currentStudent.studentId
                    )

                );


            const studentSnapshot =
                await getDocs(
                    studentQuery
                );


            if (
                studentSnapshot.empty
            ) {

                throw new Error(
                    "students collection में Student ID नहीं मिली: " +
                    currentStudent.studentId
                );

            }


            const studentDoc =
                studentSnapshot.docs[0];


            /* =============================================
               FIRESTORE TRANSACTION
            ============================================= */

            const result =
                await runTransaction(

                    db,

                    async function(transaction) {

                        const latest =
                            await transaction.get(
                                studentDoc.ref
                            );


                        const data =
                            latest.data();


                        const attendance =
                            data.attendance ||
                            {};


                        /* =================================
                           DUPLICATE CHECK
                        ================================= */

                        if (
                            attendance[today] ===
                            "Present"
                        ) {

                            return {
                                alreadyMarked:
                                    true
                            };

                        }


                        /* =================================
                           SAVE
                        ================================= */

                        attendance[today] =
                            "Present";


                        transaction.update(

                            studentDoc.ref,

                            {

                                attendance:
                                    attendance,

                                lastAttendanceDate:
                                    today,

                                lastAttendanceTime:
                                    currentTime,

                                lastAttendanceLatitude:
                                    latitude,

                                lastAttendanceLongitude:
                                    longitude

                            }

                        );


                        return {

                            alreadyMarked:
                                false

                        };

                    }

                );


            /* =============================================
               ALREADY MARKED
            ============================================= */

            if (
                result.alreadyMarked
            ) {

                locationStatus.textContent =
                    "🟡 Already Marked";

                locationMessage.innerHTML =

                    "आज की attendance पहले ही mark हो चुकी है।<br><br>" +

                    "📅 Date: <b>" +
                    today +
                    "</b>";

                attendanceButton.innerHTML =
                    "✓ TODAY'S ATTENDANCE DONE";

                return;

            }


            /* =============================================
               SUCCESS
            ============================================= */

            locationStatus.textContent =
                "🟢 Attendance Marked Successfully";

            locationMessage.innerHTML =

                "🎉 <b>Attendance Successfully Saved!</b><br><br>" +

                "👤 Student: <b>" +
                currentStudent.name +
                "</b><br>" +

                "🆔 Student ID: <b>" +
                currentStudent.studentId +
                "</b><br>" +

                "📚 Course: <b>" +
                currentStudent.course +
                "</b><br>" +

                "📅 Date: <b>" +
                today +
                "</b><br>" +

                "⏰ Time: <b>" +
                currentTime +
                "</b><br>" +

                "📍 Distance: <b>" +
                Math.round(distance) +
                "m</b>";


            attendanceButton.innerHTML =
                "✅ ATTENDANCE MARKED";


            attendanceButton.classList.add(
                "location-verified"
            );


            alert(

                "✅ ATTENDANCE MARKED!\n\n" +

                "Student: " +
                currentStudent.name +

                "\nStudent ID: " +
                currentStudent.studentId +

                "\nCourse: " +
                currentStudent.course +

                "\nDate: " +
                today +

                "\nTime: " +
                currentTime

            );

        }

        catch(error) {

            console.error(
                "ATTENDANCE ERROR:",
                error
            );


            locationStatus.textContent =
                "❌ Attendance Failed";

            locationMessage.innerHTML =
                error.message;


            attendanceButton.disabled =
                false;

            attendanceButton.innerHTML =
                "🔄 TRY AGAIN";

        }

    }
);

</script>
