<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Management</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin-students.css">

<script defer src="js/firebase.js"></script>
<script defer src="js/admin-students.js"></script>
</head>

<body>

<div class="container">

    <h1>🎓 Student Management</h1>

    <!-- Dashboard Cards -->

    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="card">
            <h3>Active</h3>
            <h2 id="activeStudents">0</h2>
        </div>

        <div class="card">
            <h3>Completed</h3>
            <h2 id="completedStudents">0</h2>
        </div>

        <div class="card">
            <h3>Left</h3>
            <h2 id="leftStudents">0</h2>
        </div>

    </div>

    <!-- Search -->

    <div class="searchBox">

        <input
        type="text"
        id="searchStudent"
        placeholder="Search by Student ID / Name / Mobile">

        <button id="searchBtn">
            🔍 Search
        </button>

        <button id="addStudentBtn">
            ➕ Add Student
        </button>

    </div>

    <!-- Student Table -->

    <div class="tableBox">

        <table>

            <thead>

                <tr>

                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Batch</th>
                    <th>Mobile</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

</div>
    <!-- =========================
     Add Student Modal
========================= -->

<div id="studentModal" class="modal">

<div class="modal-content">

<div class="modal-header">

<h2>Add New Student</h2>

<button id="closeModal">&times;</button>

</div>

<div class="formGrid">

<div>
<label>Student Name</label>
<input type="text" id="studentName">
</div>

<div>
<label>Father Name</label>
<input type="text" id="fatherName">
</div>

<div>
<label>Mother Name</label>
<input type="text" id="motherName">
</div>

<div>
<label>Mobile</label>
<input type="text" id="mobile">
</div>

<div>
<label>Email</label>
<input type="email" id="email">
</div>

<div>
<label>DOB</label>
<input type="date" id="dob">
</div>

<div>
<label>Gender</label>
<select id="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div>
<label>Course</label>
<input type="text" id="course">
</div>

<div>
<label>Batch</label>
<input type="text" id="batch">
</div>

<div>
<label>Admission Date</label>
<input type="date" id="admissionDate">
</div>

<div>
<label>Total Fees</label>
<input type="number" id="totalFees">
</div>

<div>
<label>Status</label>
<select id="status">

<option value="Active">Active</option>

<option value="Completed">Completed</option>

<option value="Left">Left</option>

</select>

</div>

<div style="grid-column:1/-1">

<label>Address</label>

<textarea id="address"></textarea>

</div>

</div>

<div class="modal-footer">

<button id="saveStudentBtn">

💾 Save Student

</button>

</div>

</div>

</div>

</body>
</html>
