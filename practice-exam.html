<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Practice Exam | Disha Computer Education</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef3f8;
    color:#222;
}

/* HEADER */

.exam-header{

    background:#173b56;
    color:white;

    padding:15px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

}

.exam-title h2{
    margin:0;
    font-size:21px;
}

.exam-title span{
    font-size:13px;
    opacity:.8;
}

.timer{

    background:#dc3545;

    padding:10px 18px;

    border-radius:8px;

    font-size:20px;

    font-weight:bold;

    min-width:110px;

    text-align:center;

}

/* MAIN */

.exam-container{

    width:95%;
    max-width:1250px;

    margin:25px auto;

    display:grid;

    grid-template-columns:
    1fr 280px;

    gap:20px;

}

/* QUESTION CARD */

.question-card{

    background:white;

    border-radius:15px;

    padding:30px;

    box-shadow:0 5px 20px rgba(0,0,0,.12);

}

.question-number{

    color:#1769aa;

    font-weight:bold;

    margin-bottom:15px;

}

.question-text{

    font-size:20px;

    font-weight:bold;

    line-height:1.5;

    margin-bottom:25px;

}

/* OPTIONS */

.option{

    display:flex;

    align-items:center;

    gap:12px;

    padding:15px;

    margin:12px 0;

    border:1px solid #ddd;

    border-radius:10px;

    cursor:pointer;

    transition:.2s;

}

.option:hover{

    background:#f0f7ff;

    border-color:#1677d2;

}

.option input{

    width:18px;
    height:18px;

}

/* BUTTONS */

.navigation{

    display:flex;

    justify-content:space-between;

    gap:12px;

    margin-top:30px;

}

.nav-btn{

    padding:12px 22px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;

}

.previous{

    background:#6c757d;
    color:white;
}

.next{

    background:#1677d2;
    color:white;
}

.submit{

    background:#198754;
    color:white;
}

/* PALETTE */

.palette-card{

    background:white;

    border-radius:15px;

    padding:20px;

    box-shadow:0 5px 20px rgba(0,0,0,.12);

    height:max-content;

}

.palette-card h3{

    margin-top:0;

    color:#173b56;

}

.palette{

    display:grid;

    grid-template-columns:
    repeat(5,1fr);

    gap:8px;

}

.q-btn{

    border:none;

    border-radius:7px;

    padding:10px 5px;

    cursor:pointer;

    background:#e9ecef;

    color:#222;

    font-weight:bold;

}

.q-btn.current{

    background:#1677d2;
    color:white;
}

.q-btn.answered{

    background:#198754;
    color:white;
}

/* LEGEND */

.legend{

    margin-top:20px;

    font-size:13px;

}

.legend div{

    margin:8px 0;

}

.dot{

    display:inline-block;

    width:13px;
    height:13px;

    border-radius:50%;

    margin-right:7px;

}

.blue{
    background:#1677d2;
}

.green{
    background:#198754;
}

.grey{
    background:#e9ecef;
}

/* MOBILE */

@media(max-width:800px){

    .exam-header{

        padding:13px 15px;

    }

    .exam-title h2{

        font-size:17px;

    }

    .timer{

        font-size:17px;

        padding:8px 12px;

        min-width:95px;

    }

    .exam-container{

        grid-template-columns:1fr;

        width:94%;

    }

    .question-card{

        padding:20px;

    }

    .question-text{

        font-size:18px;

    }

    .palette-card{

        order:2;

    }

    .navigation{

        flex-wrap:wrap;

    }

    .nav-btn{

        flex:1;

        min-width:100px;

    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="exam-header">

<div class="exam-title">

<h2 id="courseTitle">
Practice Test
</h2>

<span id="studentDisplay">
Student
</span>

</div>

<div class="timer" id="timer">

10:00

</div>

</header>


<!-- EXAM -->

<main class="exam-container">


<!-- QUESTION -->

<section class="question-card">


<div class="question-number">

Question <span id="questionNumber">1</span>
of
<span id="totalQuestions">10</span>

</div>


<div
class="question-text"
id="questionText">

Loading Question...

</div>


<div id="optionsContainer">

</div>


<div class="navigation">

<button
class="nav-btn previous"
id="previousBtn">

← Previous

</button>


<button
class="nav-btn next"
id="nextBtn">

Next →

</button>


<button
class="nav-btn submit"
id="submitBtn">

Submit

</button>

</div>


</section>


<!-- QUESTION PALETTE -->

<aside class="palette-card">

<h3>
Question Palette
</h3>

<div
class="palette"
id="questionPalette">

</div>


<div class="legend">

<div>
<span class="dot blue"></span>
Current
</div>

<div>
<span class="dot green"></span>
Answered
</div>

<div>
<span class="dot grey"></span>
Not Answered
</div>

</div>

</aside>


</main>


<script>

/* =========================
   COURSE
========================= */

const params =
new URLSearchParams(window.location.search);

const course =
(params.get("course") || "olevel")
.toLowerCase();


/* =========================
   STUDENT
========================= */

const studentName =
localStorage.getItem("practiceStudentName")
|| "Student";


document.getElementById("studentDisplay")
.innerText =
studentName;


/* =========================
   COURSE TITLE
========================= */

const courseNames = {

    olevel:"O Level Practice Test",

    ccc:"CCC Practice Test",

    python:"Python Practice Test",

    tally:"Tally Prime Practice"

};


document.getElementById("courseTitle")
.innerText =
courseNames[course]
|| "Practice Test";


/* =========================
   DEMO QUESTIONS
========================= */

const questions = [

{

question:"What does CPU stand for?",

options:[

"Central Processing Unit",

"Computer Personal Unit",

"Central Program Utility",

"Control Processing User"

],

answer:0

},

{

question:"Which device is used to enter text into a computer?",

options:[

"Monitor",

"Keyboard",

"Printer",

"Speaker"

],

answer:1

},

{

question:"Which of the following is an operating system?",

options:[

"Windows",

"Google",

"HTML",

"CPU"

],

answer:0

},

{

question:"Which language is commonly used for web page structure?",

options:[

"HTML",

"Python",

"SQL",

"C"

],

answer:0

},

{

question:"Which one is a programming language?",

options:[

"Python",

"Keyboard",

"Monitor",

"Printer"

],

answer:0

},

{

question:"What is the full form of RAM?",

options:[

"Random Access Memory",

"Read Access Memory",

"Run Access Machine",

"Random Application Module"

],

answer:0

},

{

question:"Which device displays computer output?",

options:[

"Keyboard",

"Mouse",

"Monitor",

"Scanner"

],

answer:2

},

{

question:"Which is used to store files permanently?",

options:[

"RAM",

"Hard Disk",

"Cache",

"Register"

],

answer:1

},

{

question:"Which symbol is commonly used for a web address?",

options:[

"URL",

"CPU",

"RAM",

"ROM"

],

answer:0

},

{

question:"Which one is an input device?",

options:[

"Monitor",

"Printer",

"Keyboard",

"Speaker"

],

answer:2

}

];


/* =========================
   VARIABLES
========================= */

let currentQuestion = 0;

let answers =
new Array(questions.length)
.fill(null);

let totalSeconds = 10 * 60;


/* =========================
   ELEMENTS
========================= */

const questionText =
document.getElementById("questionText");

const optionsContainer =
document.getElementById("optionsContainer");

const questionNumber =
document.getElementById("questionNumber");

const totalQuestions =
document.getElementById("totalQuestions");

const palette =
document.getElementById("questionPalette");

const timer =
document.getElementById("timer");


totalQuestions.innerText =
questions.length;


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

    const q =
    questions[currentQuestion];


    questionNumber.innerText =
    currentQuestion + 1;


    questionText.innerText =
    q.question;


    optionsContainer.innerHTML="";


    q.options.forEach(
    (option,index)=>{

        const label =
        document.createElement("label");

        label.className="option";


        label.innerHTML=`

        <input
        type="radio"
        name="answer"
        value="${index}"
        ${answers[currentQuestion] === index
        ? "checked"
        : ""}>

        <span>${option}</span>

        `;


        label.querySelector("input")
        .addEventListener(
        "change",
        function(){

            answers[currentQuestion] =
            index;

            renderPalette();

        });


        optionsContainer
        .appendChild(label);

    });


    renderPalette();

}


/* =========================
   PALETTE
========================= */

function renderPalette(){

    palette.innerHTML="";


    questions.forEach(
    (q,index)=>{

        const btn =
        document.createElement("button");

        btn.className="q-btn";

        btn.innerText =
        index + 1;


        if(index === currentQuestion){

            btn.classList.add("current");

        }

        else if(answers[index] !== null){

            btn.classList.add("answered");

        }


        btn.onclick=function(){

            currentQuestion =
            index;

            showQuestion();

        };


        palette.appendChild(btn);

    });

}


/* =========================
   NEXT
========================= */

document.getElementById("nextBtn")
.onclick=function(){

    if(currentQuestion <
    questions.length - 1){

        currentQuestion++;

        showQuestion();

    }

};


/* =========================
   PREVIOUS
========================= */

document.getElementById("previousBtn")
.onclick=function(){

    if(currentQuestion > 0){

        currentQuestion--;

        showQuestion();

    }

};


/* =========================
   SUBMIT
========================= */

document.getElementById("submitBtn")
.onclick=function(){

    const confirmSubmit =
    confirm(
    "Are you sure you want to submit the test?"
    );


    if(!confirmSubmit){

        return;

    }


    finishTest();

};


/* =========================
   RESULT
========================= */

function finishTest(){

    let score=0;


    questions.forEach(
    (q,index)=>{

        if(answers[index] === q.answer){

            score++;

        }

    });


    const percentage =
    Math.round(
    (score / questions.length) * 100
    );


    localStorage.setItem(
    "practiceScore",
    score
    );


    localStorage.setItem(
    "practicePercentage",
    percentage
    );


    alert(

    "Practice Test Completed!\n\n"
    +
    "Score : "
    + score
    + " / "
    + questions.length
    + "\n"
    +
    "Percentage : "
    + percentage
    + "%"

    );


    window.location.href =
    "practice-test.html";

}


/* =========================
   TIMER
========================= */

const timerInterval =
setInterval(

function(){

    totalSeconds--;


    const minutes =
    Math.floor(
    totalSeconds / 60
    );


    const seconds =
    totalSeconds % 60;


    timer.innerText =

    String(minutes)
    .padStart(2,"0")
    + ":"
    +
    String(seconds)
    .padStart(2,"0");


    if(totalSeconds <= 0){

        clearInterval(
        timerInterval
        );

        alert(
        "Time Over! Test submitted automatically."
        );

        finishTest();

    }

},

1000);


/* =========================
   START
========================= */

showQuestion();

</script>


</body>

</html>
