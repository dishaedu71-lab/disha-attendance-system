<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Practice Exam | Disha Computer Education</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef3f8;
    color:#222;
}


/* =========================
   HEADER
========================= */

.exam-header{

    background:#173b56;
    color:white;

    padding:15px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    position:sticky;
    top:0;
    z-index:1000;
}

.exam-title h2{
    margin:0 0 5px;
    font-size:21px;
}

.exam-title span{
    font-size:13px;
    opacity:.85;
}


/* =========================
   TIMER
========================= */

.timer{

    background:#dc3545;
    color:white;

    padding:10px 18px;

    border-radius:8px;

    font-size:20px;
    font-weight:bold;

    min-width:110px;

    text-align:center;
}


/* =========================
   MAIN
========================= */

.exam-container{

    width:95%;
    max-width:1250px;

    margin:25px auto;

    display:grid;

    grid-template-columns:
    minmax(0,1fr) 280px;

    gap:20px;
}


/* =========================
   QUESTION CARD
========================= */

.question-card{

    background:white;

    border-radius:15px;

    padding:30px;

    box-shadow:
    0 5px 20px rgba(0,0,0,.12);
}

.question-number{

    color:#1769aa;

    font-weight:bold;

    margin-bottom:15px;
}

.question-text{

    font-size:20px;

    font-weight:bold;

    line-height:1.6;

    margin-bottom:25px;
}


/* =========================
   OPTIONS
========================= */

.option{

    display:flex;

    align-items:center;

    gap:12px;

    padding:15px;

    margin:12px 0;

    border:1px solid #ddd;

    border-radius:10px;

    cursor:pointer;

    background:white;

    transition:.2s;
}

.option:hover{

    background:#f0f7ff;

    border-color:#1677d2;
}

.option input{

    width:18px;
    height:18px;
}


/* =========================
   NAVIGATION
========================= */

.navigation{

    display:flex;

    justify-content:space-between;

    gap:12px;

    margin-top:30px;

    flex-wrap:wrap;
}

.nav-btn{

    padding:12px 22px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;
}

.previous{

    background:#6c757d;
    color:white;
}

.next{

    background:#1677d2;
    color:white;
}

.submit{

    background:#198754;
    color:white;
}


/* =========================
   PALETTE
========================= */

.palette-card{

    background:white;

    border-radius:15px;

    padding:20px;

    box-shadow:
    0 5px 20px rgba(0,0,0,.12);

    height:max-content;
}

.palette-card h3{

    margin-top:0;

    color:#173b56;
}

.palette{

    display:grid;

    grid-template-columns:
    repeat(5,1fr);

    gap:8px;
}

.q-btn{

    border:none;

    border-radius:7px;

    padding:10px 5px;

    cursor:pointer;

    background:#e9ecef;

    color:#222;

    font-weight:bold;
}

.q-btn.current{

    background:#1677d2;

    color:white;
}

.q-btn.answered{

    background:#198754;

    color:white;
}


/* =========================
   LEGEND
========================= */

.legend{

    margin-top:20px;

    font-size:13px;
}

.legend div{

    margin:8px 0;
}

.dot{

    display:inline-block;

    width:13px;
    height:13px;

    border-radius:50%;

    margin-right:7px;
}

.blue{
    background:#1677d2;
}

.green{
    background:#198754;
}

.grey{
    background:#e9ecef;
}


/* =========================
   LOADING
========================= */

#loadingBox{

    text-align:center;

    padding:50px 20px;

    font-size:20px;

    color:#1769aa;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .exam-header{

        padding:13px 15px;
    }

    .exam-title h2{

        font-size:17px;
    }

    .timer{

        font-size:17px;

        padding:8px 12px;

        min-width:95px;
    }

    .exam-container{

        grid-template-columns:1fr;

        width:94%;
    }

    .question-card{

        padding:20px;
    }

    .question-text{

        font-size:18px;
    }

    .palette-card{

        order:2;
    }

    .nav-btn{

        flex:1;

        min-width:100px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="exam-header">


<div class="exam-title">

<h2 id="courseTitle">
Practice Test
</h2>

<span id="studentDisplay">
Student
</span>

</div>


<div
class="timer"
id="timer">

10:00

</div>


</header>


<!-- =========================
     EXAM AREA
========================= -->

<main class="exam-container">


<section class="question-card">


<div id="loadingBox">

⏳ Loading Practice Test...

</div>


<div
id="examArea"
style="display:none;">


<div class="question-number">

Question

<span id="questionNumber">
1
</span>

of

<span id="totalQuestions">
0
</span>

</div>


<div
class="question-text"
id="questionText">
</div>


<div
id="optionsContainer">
</div>


<div class="navigation">


<button
class="nav-btn previous"
id="previousBtn">

← Previous

</button>


<button
class="nav-btn next"
id="nextBtn">

Next →

</button>

class="nav-btn submit"
id="submitBtn">

</button>


</div>


</div>

</section>


<!-- =========================
     PALETTE
========================= -->

<aside class="palette-card">


<h3>
Question Palette
</h3>


<div
class="palette"
id="questionPalette">
</div>


<div class="legend">


<div>

<span class="dot blue"></span>
Current

</div>


<div>

<span class="dot green"></span>
Answered

</div>


<div>

<span class="dot grey"></span>
Not Answered

</div>


</div>

</aside>


</main>


<!-- =========================
     FIREBASE
========================= -->

<script
type="module"
src="js/firebase.js">
</script>
<script>

window.addEventListener("firebase-ready", async function(){

    /* =========================
       GET COURSE
    ========================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const course =
        (params.get("course") || "olevel")
        .toLowerCase();
    window.practiceCourse = course;

    const module =
    (params.get("module") || "")
    .toLowerCase();

window.practiceModule = module;


    /* =========================
       STUDENT NAME
    ========================= */

    const studentName =
        localStorage.getItem(
            "practiceStudentName"
        ) || "Student";


    document.getElementById(
        "studentDisplay"
    ).innerText = studentName;


    /* =========================
       COURSE TITLE
    ========================= */

    const courseNames = {

        olevel:
            "O Level Practice Test",

        ccc:
            "CCC Practice Test",

        python:
            "Python Practice Test",

        tally:
            "Tally Prime Practice"

    };


    document.getElementById(
        "courseTitle"
    ).innerText =
        courseNames[course]
        || "Practice Test";


    /* =========================
       FIREBASE
    ========================= */

    try{

        const db =
            window.db;

        const collection =
            window.collection;

        const getDocs =
            window.getDocs;

        const query =
            window.query;

        const where =
            window.where;


        /* =========================
           COLLECTION
        ========================= */

        const questionsRef =
            collection(
                db,
                "practice_questions"
            );


        /* =========================
           COURSE FILTER
        ========================= */

        let questionQuery =
    query(

        questionsRef,

        where(
            "course",
            "==",
            course
        ),

        where(
            "active",
            "==",
            true
        )

    );


/* =========================
   O LEVEL MODULE FILTER
========================= */

if (
    course === "olevel" &&
    ["m1", "m2", "m3", "m4"].includes(
        module
    )
) {

    questionQuery =
        query(

            questionsRef,

            where(
                "course",
                "==",
                "olevel"
            ),

            where(
                "module",
                "==",
                module
            ),

            where(
                "active",
                "==",
                true
            )

        );

}

        /* =========================
           GET DATA
        ========================= */

        const snapshot =
            await getDocs(
                questionQuery
            );


        /* =========================
           NO QUESTIONS
        ========================= */

        if(snapshot.empty){

            document.getElementById(
                "loadingBox"
            ).innerHTML = `

                ❌ No Practice Questions Found

                <br><br>

                <small>
                Course:
                ${course}
                </small>

            `;

            return;

        }


        /* =========================
           CREATE QUESTIONS ARRAY
        ========================= */

        window.practiceQuestions = [];


        snapshot.forEach(function(doc){

            const data =
                doc.data();


            window.practiceQuestions.push({

                id: doc.id,

                question:
                    data.question || "",

                options:[

                    data.optionA || "",

                    data.optionB || "",

                    data.optionC || "",

                    data.optionD || ""

                ],

                answer:
                    String(
                        data.answer || ""
                    )
                    .trim()
                    .toUpperCase()

            });

        });


        /* =========================
           RANDOM QUESTIONS
        ========================= */

        window.practiceQuestions.sort(
            function(){

                return Math.random() - 0.5;

            }
        );

        /* =========================
   RANDOM QUESTION LIMIT
========================= */

const questionLimit = 25;


/* अगर questions 25 से कम हैं
   तो जितने available हैं उतने ही आएँगे */

if(window.practiceQuestions.length > questionLimit){

    window.practiceQuestions =
        window.practiceQuestions.slice(
            0,
            questionLimit
        );

}


        /* =========================
           SHOW EXAM AREA
        ========================= */

        document.getElementById(
            "loadingBox"
        ).style.display = "none";


        document.getElementById(
            "examArea"
        ).style.display = "block";


        document.getElementById(
            "totalQuestions"
        ).innerText =
            window.practiceQuestions.length;


        /* =========================
           START ENGINE
        ========================= */

        window.startPracticeExam();

    }

    catch(error){

        console.error(
            "Practice Firebase Error:",
            error
        );


        document.getElementById(
            "loadingBox"
        ).innerHTML = `

            ❌ Questions Load नहीं हो सके।

            <br><br>

            <small>
            ${error.message}
            </small>

        `;

    }

});

</script>

  <script>

window.startPracticeExam = function () {

    const questions = window.practiceQuestions || [];

    if (questions.length === 0) {
        alert("No questions found.");
        return;
    }

    let currentQuestion = 0;

    let answers =
        new Array(questions.length).fill(null);

    let totalSeconds =
        Number(localStorage.getItem("practiceTime")) * 60;

    if (!totalSeconds || totalSeconds <= 0) {
        totalSeconds = 10 * 60;
    }

    const questionText =
        document.getElementById("questionText");

    const questionNumber =
        document.getElementById("questionNumber");

    const totalQuestions =
        document.getElementById("totalQuestions");

    const optionsContainer =
        document.getElementById("optionsContainer");

    const palette =
        document.getElementById("questionPalette");

    const timer =
        document.getElementById("timer");


    totalQuestions.innerText =
        questions.length;


    /* =========================
       ANSWER INDEX
    ========================= */

    function answerIndex(answer) {

        const value =
            String(answer || "")
            .trim()
            .toUpperCase();

        if (value === "A") return 0;
        if (value === "B") return 1;
        if (value === "C") return 2;
        if (value === "D") return 3;

        if (value === "0") return 0;
        if (value === "1") return 1;
        if (value === "2") return 2;
        if (value === "3") return 3;

        return -1;
    }


    /* =========================
       SHOW QUESTION
    ========================= */

    function showQuestion() {

        const q =
            questions[currentQuestion];


        questionNumber.innerText =
            currentQuestion + 1;


        questionText.innerText =
            q.question;


        optionsContainer.innerHTML = "";


        q.options.forEach(
            function (option, index) {

                const label =
                    document.createElement("label");


                label.className = "option";


                label.innerHTML = `

                    <input
                        type="radio"
                        name="answer"
                        value="${index}"
                    >

                    <span>
                        ${option}
                    </span>

                `;


                const radio =
                    label.querySelector("input");


                if (
                    answers[currentQuestion]
                    === index
                ) {

                    radio.checked = true;

                }


                radio.addEventListener(
                    "change",
                    function () {

                        answers[currentQuestion] =
                            index;

                        renderPalette();

                    }
                );


                optionsContainer.appendChild(label);

            }
        );


        renderPalette();


        document.getElementById(
            "previousBtn"
        ).disabled =
            currentQuestion === 0;


        document.getElementById(
            "nextBtn"
        ).disabled =
            currentQuestion ===
            questions.length - 1;

    }


    /* =========================
       PALETTE
    ========================= */

    function renderPalette() {

        palette.innerHTML = "";


        questions.forEach(
            function (q, index) {

                const button =
                    document.createElement("button");


                button.type = "button";

                button.className = "q-btn";

                button.innerText =
                    index + 1;


                if (
                    index === currentQuestion
                ) {

                    button.classList.add(
                        "current"
                    );

                }
                else if (
                    answers[index] !== null
                ) {

                    button.classList.add(
                        "answered"
                    );

                }


                button.onclick =
                    function () {

                        currentQuestion =
                            index;

                        showQuestion();

                    };


                palette.appendChild(button);

            }
        );

    }


    /* =========================
       NEXT
    ========================= */

    document.getElementById(
        "nextBtn"
    ).onclick = function () {

        if (
            currentQuestion <
            questions.length - 1
        ) {

            currentQuestion++;

            showQuestion();

        }

    };


    /* =========================
       PREVIOUS
    ========================= */

    document.getElementById(
        "previousBtn"
    ).onclick = function () {

        if (currentQuestion > 0) {

            currentQuestion--;

            showQuestion();

        }

    };


    /* =========================
       SUBMIT
    ========================= */

    document.getElementById(
        "submitBtn"
    ).onclick = function () {

        const ok =
            confirm(
                "Are you sure you want to submit the test?"
            );


        if (!ok) {
            return;
        }


        finishTest();

    };


    /* =========================
       FINISH TEST
    ========================= */

    function finishTest() {

        let score = 0;

        let attempted = 0;


        questions.forEach(
            function (q, index) {

                if (
                    answers[index] !== null
                ) {

                    attempted++;

                }


                const correct =
                    answerIndex(q.answer);


                if (
                    answers[index] === correct
                ) {

                    score++;

                }

            }
        );


        const wrong =
            attempted - score;


        const unanswered =
            questions.length - attempted;


        const percentage =
            Math.round(
                (score / questions.length) * 100
            );


        /* SAVE RESULT */

        localStorage.setItem(
            "practiceScore",
            score
        );


        localStorage.setItem(
            "practiceTotal",
            questions.length
        );


        localStorage.setItem(
            "practiceAttempted",
            attempted
        );


        localStorage.setItem(
            "practiceWrong",
            wrong
        );


        localStorage.setItem(
            "practiceUnanswered",
            unanswered
        );


        localStorage.setItem(
            "practicePercentage",
            percentage
        );


        /* COURSE */

        localStorage.setItem(
            "practiceCourse",
            window.practiceCourse || "Practice Test"
        );


        /* GO TO RESULT */

        window.location.href =
            "practice-result.html";

    }

/* =========================
   LOAD EXAM SETTINGS
========================= */

async function loadExamSettings() {

    try {

        const settingsRef =
            window.doc(
                window.db,
                "exam_settings",
                window.practiceCourse || course
            );

        const settingsSnap =
            await window.getDoc(settingsRef);


        if (settingsSnap.exists()) {

            const settings =
                settingsSnap.data();

            totalSeconds =
                Number(settings.examTime || 30) * 60;

        } else {

            totalSeconds =
                30 * 60;

        }

    }

    catch(error) {

        console.error(
            "Exam Settings Error:",
            error
        );

        totalSeconds =
            30 * 60;

    }

}
 /* =========================
   TIMER
========================= */

let timerInterval;


/* =========================
   LOAD TIMER FROM FIREBASE
========================= */

async function startExamTimer() {

    try {

        const courseCode =
            window.practiceCourse || course;

        const settingsRef =
            window.doc(
                window.db,
                "exam_settings",
                courseCode
            );

        const settingsSnap =
            await window.getDoc(
                settingsRef
            );


        if (settingsSnap.exists()) {

            const settings =
                settingsSnap.data();

            totalSeconds =
                Number(
                    settings.examTime || 30
                ) * 60;

        } else {

            /* DEFAULT */

            totalSeconds =
                30 * 60;

        }

    }

    catch(error) {

        console.error(
            "Timer Settings Error:",
            error
        );

        /* DEFAULT */

        totalSeconds =
            30 * 60;

    }


    /* =========================
       UPDATE TIMER
    ========================= */

    function updateTimer() {

        const minutes =
            Math.floor(
                totalSeconds / 60
            );


        const seconds =
            totalSeconds % 60;


        timer.innerText =
            String(minutes).padStart(2, "0")
            + ":"
            + String(seconds).padStart(2, "0");


        if (totalSeconds <= 60) {

            timer.style.background =
                "#ff0000";

        }


        if (totalSeconds <= 0) {

            clearInterval(
                timerInterval
            );


            alert(
                "⏰ Time Over! Test submitted automatically."
            );


            finishTest();

        }

    }


    /* FIRST DISPLAY */

    updateTimer();


    /* START COUNTDOWN */

    timerInterval =
        setInterval(
            function () {

                totalSeconds--;

                updateTimer();

            },
            1000
        );

}


/* START TIMER */

startExamTimer();

    /* =========================
       FIRST QUESTION
    ========================= */

    showQuestion();

};

</script>
