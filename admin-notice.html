<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Website Notice</title>

<link rel="stylesheet" href="css/style.css">

<style>

.notice-new-badge {

    display: inline-block;

    margin-left: 10px;

    padding: 5px 10px;

    background: red;

    color: white;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

    vertical-align: middle;

    animation: noticeNewBlink 0.8s infinite;

    box-shadow: 0 0 10px red;

}


@keyframes noticeNewBlink {

    0% {

        opacity: 1;

        transform: scale(1);

    }

    50% {

        opacity: 0.2;

        transform: scale(0.85);

    }

    100% {

        opacity: 1;

        transform: scale(1);

    }

}


.notice-heading {

    display: block;

}


.single-notice {

    margin-bottom: 20px;

}


.notice-action-btn {

    display: inline-block;

    margin-top: 12px;

    padding: 11px 20px;

    background: #007bff;

    color: white;

    text-decoration: none;

    border-radius: 9px;

    font-weight: bold;

}


.notice-text {

    line-height: 26px;

}

</style>

</head>

<body>

<nav>

<div class="logo">

📢 WEBSITE NOTICE

</div>

<ul>

<li>

<a href="admin-dashboard.html">

Dashboard

</a>

</li>

</ul>

</nav>

<section class="dashboard">

<div
class="card"
style="
max-width:700px;
margin:auto;
padding:30px;">

<h2>

Website Popup Notice

</h2>

<hr><br>

<label>Notice Title</label>

<input
id="title"
type="text"
style="width:100%;padding:12px;">

<br><br>

<label>Notice Message</label>

<textarea
id="message"
rows="5"
style="width:100%;padding:12px;"></textarea>

<br><br>

<label>Button Text</label>

<input
id="buttonText"
type="text"
style="width:100%;padding:12px;">

<br><br>

<label>Button Link</label>

<input
id="buttonLink"
type="text"
style="width:100%;padding:12px;">

<br><br>

<label>

<input
type="checkbox"
id="active">

Popup Active

</label>

<br><br>

<button
id="saveNotice"
class="login-btn">

SAVE NOTICE

</button>

  <br><br>

<button
id="deleteNotice"
style="
width:100%;
padding:15px;
background:#dc3545;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;">

🗑 DELETE NOTICE

</button>
  <hr style="margin:25px 0;">

<h3 style="text-align:center;">
Saved Notices
</h3>

<div id="noticeList"></div>
  
</div>

</section>

<script type="module" src="js/firebase.js"></script>

<script src="js/admin-notice.js"></script>

</body>

</html>
