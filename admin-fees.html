<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Fees Management</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<nav>
<div class="logo">
<i class="fa-solid fa-graduation-cap"></i>
DISHA COMPUTER EDUCATION
</div>

<ul>
<li><a href="admin-dashboard.html">Dashboard</a></li>
</ul>

<a href="admin-dashboard.html" class="login-btn">
Admin
</a>

</nav>

<section class="hero">

<div class="glass">

<h1>Fees Management</h1>

<p>Search Student and Update Fees</p>

<br><br>

<input
type="text"
id="studentId"
placeholder="Enter Student ID">

<br><br>
  <hr><br>

<h3>New Payment</h3>

<input
type="number"
id="paymentAmount"
placeholder="Enter Payment Amount">

<br><br>

<select id="paymentMode">

<option value="Cash">Cash</option>

<option value="UPI">UPI</option>

<option value="Online">Online</option>

</select>

<br><br>

<input
type="date"
id="paymentDate">

<br><br>

<input
type="text"
id="remarks"
placeholder="Remarks">

<br><br>

<button
id="searchBtn"
class="start-btn">

Search Student

</button>

<hr><br>

<input
type="number"
id="totalFees"
placeholder="Total Fees">

<br><br>

<input
type="number"
id="paidFees"
placeholder="Paid Fees">

<br><br>

<input
type="number"
id="dueFees"
placeholder="Due Fees"
readonly>

<br><br>

<input
type="text"
id="feeStatus"
placeholder="Status"
readonly>

<br><br>

<button id="saveBtn" class="start-btn">

Save Payment

</button>

</div>
  <hr><br>

<h2>Payment History</h2>

<table border="1" width="100%" cellpadding="10">

<thead>

<tr>

<th>Receipt</th>

<th>Date</th>

<th>Amount</th>

<th>Mode</th>

<th>Status</th>

</tr>

</thead>

<tbody id="adminPaymentHistory">

</tbody>

</table>

</section>

<script type="module" src="js/admin-fees.js"></script>

</body>
</html>
